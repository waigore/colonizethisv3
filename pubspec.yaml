name: colonizethis
publish_to: none

environment:
  sdk: '>=3.11.5 <4.0.0'

workspace:
  - app
  - widgetbook_host
  - ctdev
  - packages/colonizethis_exception_lint
  - packages/session_log_buffer
  - packages/colonizethis_logger
  - packages/colonizethis_models
  - packages/colonizethis_data
  - packages/colonizethis_save
  - packages/colonizethis_logic
  - packages/colonizethis_world
  - packages/colonizethis_ai
  - packages/colonizethis_debug_console
  - packages/colonizethis_map
  - packages/colonizethis_test
  - tool/generate_map
  - tool/init_game
  - tool/run_observer_game
  - tool/sim_economy
  - tool/sim_combat
  - tool/sim_combat_montecarlo
  - tool/sim_scenarios
  - tool/show_tech
  - tool/check_gdd_coverage

dev_dependencies:
  analyzer: 8.4.0
  colonizethis_exception_lint:
    path: packages/colonizethis_exception_lint
  image: ^4.5.4
  melos: ^7.7.0
  path: ^1.9.1
  test: 1.30.0
  yaml: ^3.1.3

melos:
  scripts:
    test_app:
      description: Run Flutter widget tests for the app (use this, not dart test app/...).
      run: bash -c "cd app && flutter test test/"
    generate_map:
      description: End-to-end map generation (topology + tile map + PNG) or load topology. SPEC/program/map-data.md.
      run: dart run generate_map
    init_game:
      description: Game creation (map gen, province/capital assignment). SPEC/program/init-game-tool.md.
      run: dart run init_game
    run_observer_game:
      description: Full-AI observer runner; traces and snapshots. SPEC/program/run_observer_game-tool.md.
      run: dart run run_observer_game
    sim_economy:
      description: Standalone Phase 2 economy simulation CLI. SPEC/program/sim-economy.md.
      run: dart run sim_economy
    sim_combat:
      description: Standalone Phase 3 combat simulation CLI. SPEC/program/sim-combat.md.
      run: dart run sim_combat
    sim_combat_montecarlo:
      description: Monte Carlo combat simulation CLI. SPEC/program/sim-combat-montecarlo.md.
      run: dart run sim_combat_montecarlo
    sim_scenarios:
      description: Batch scenario test driver for game integration testing. SPEC/program/sim-scenarios.md.
      run: dart run sim_scenarios
    show_tech:
      description: Technology tree diagram and query (SPEC/program/show-tech-tool.md).
      run: dart run show_tech
    check_gdd_coverage:
      description: Report which GDD specs (SPEC/game) are covered by sim_scenarios. SPEC/project/gdd-scenario-coverage.md.
      run: dart run check_gdd_coverage
    check_custom_exceptions:
      description: AST check that forbids generic exceptions in runtime domain code. SPEC/program/exception-enforcement.md.
      run: dart run tool/check_custom_exceptions.dart
    custom_lint_domain_exceptions:
      description: Run custom_lint in packages wired for colonizethis_exception_lint. SPEC/program/exception-enforcement.md.
      run: bash tool/run_custom_lint_domain_exceptions.sh
    check_app_hardcoded_ui_strings:
      description: AST check that forbids hardcoded user-visible UI strings in app/lib. SPEC/program/localization.md.
      run: dart run tool/check_app_hardcoded_ui_strings.dart
    check_disallowed_ast_patterns:
      description: Config-driven AST check for disallowed structural patterns. SPEC/program/disallowed-ast-patterns.md.
      run: dart run tool/check_disallowed_ast_patterns.dart
    codegen_order_engine:
      description: Regenerate OrderEngine slot wiring from order_engine_manifest.yaml. SPEC/program/order-engine.md.
      run: dart run tool/generate_order_engine_slots.dart
    codegen_verify:
      description: Regenerate OrderEngine slots and fail if order_engine.g.dart is out of sync (CI gate).
      run: bash tool/verify_order_engine_codegen.sh
    ct_repo_lint:
      description: Unified manifest-driven repo convention checks. SPEC/program/repo-lint.md.
      run: dart run tool/ct_repo_lint.dart
    workspace_analyze_errors_only:
      description: Run dart/flutter analyze for every pub workspace member; fail on analyzer errors only (GitHub #2014).
      run: dart run tool/run_workspace_analyze_errors_only.dart
