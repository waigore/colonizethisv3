arb-dir: lib/l10n
template-arb-file: app_en.arb
# Distinct filename so `flutter gen-l10n` (during build/run) never overwrites the
# hand-maintained English library shell `lib/l10n/app_localizations_en.dart` (Refs #2021).
output-localization-file: app_l10n_flutter_gen.dart
untranslated-messages-file: lib/l10n/untranslated.json
required-resource-attributes: true
# App code imports `package:colonizethis_app/l10n/l10n.dart` (contract + delegate + `appL10n`).
# CI runs `dart run tool/patch_app_localizations_after_gen_l10n.dart` after `flutter gen-l10n`
# to restore `app_localizations_en.dart` if gen overwrote it.
