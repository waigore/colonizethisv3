name: colonizethis_app
description: Colonize This — turn-based strategy game. Flutter app shell.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.37.0
  jenny: ^1.5.1
  logger: ^2.0.2
  flutter_riverpod: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  session_log_buffer:
  colonizethis_logger:
  colonizethis_map:
  colonizethis_models:
  colonizethis_data:
  colonizethis_save:
  colonizethis_logic:
  colonizethis_ai:
  colonizethis_debug_console:
  widgetbook: ^3.23.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  window_manager: ^0.5.1

dev_dependencies:
  colonizethis_test:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  colonizethis_exception_lint:
    path: ../packages/colonizethis_exception_lint
  custom_lint: 0.8.1
  hardcoded_strings_lint: 1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icons/
    - assets/icons/32/
    - assets/icons/64/
    - assets/images/
    - assets/images/terrain/
    - assets/images/terrain/base_64/
    - assets/images/terrain/base_32/
    - assets/images/terrain/tilesets/
    - assets/dialogue/

