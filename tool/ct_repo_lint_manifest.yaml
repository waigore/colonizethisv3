# Unified repo convention checks — manifest for `dart run tool/ct_repo_lint.dart`.
# SPEC: SPEC/program/repo-lint.md
version: 1

# Scan contract (Dart): domain lib trees + identifier-literal roots/skip helpers —
# tool/ct_repo_lint_scan_contract.dart
shared_scan_notes:
  dart_contract: tool/ct_repo_lint_scan_contract.dart
  exclude_path_globs:
    - "**/test/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

rules:
  - rule_id: repo.test_imports
    group: structure
    title: Test import convention (colonizethis_test first)
    spec: SPEC/program/test-logging.md
    runner: shell
    argv: [tool/check_test_imports.sh]

  - rule_id: repo.logic_ai_decoupling
    group: architecture
    title: colonizethis_logic / colonizethis_ai dependency boundary
    spec: SPEC/program/repo-and-packages.md
    runner: shell
    argv: [tool/check_logic_ai_decoupling.sh]

  - rule_id: repo.logic_dead_files
    group: architecture
    title: colonizethis_logic dead-file detection under lib/src
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_logic_dead_files.dart

  - rule_id: repo.logic_dedup_logger
    group: architecture
    title: split logic-domain packages must use a shared package logger (Refs #2391, #3290)
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_logic_dedup_logger.dart

  - rule_id: repo.domain_package_logger_dedup
    group: architecture
    title: packages/*/lib/package_logger.dart must delegate to the shared domainPackageLogger factory (Refs #3393 Phase 2)
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_domain_package_logger_dedup.dart

  - rule_id: repo.ai_api_narrow_surface
    group: architecture
    title: ai_api.dart must re-export sibling-domain symbols through domain barrels, not barrel-bypassing deep src/ paths (Refs #3393 Phase 3)
    spec: SPEC/program/logic-package-barrel-contracts.md
    runner: dart
