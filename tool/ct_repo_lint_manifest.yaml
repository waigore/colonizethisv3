# Unified repo convention checks — manifest for `dart run tool/ct_repo_lint.dart`.
# SPEC: SPEC/program/repo-lint.md
version: 1

# Scan contract (Dart): domain lib trees + identifier-literal roots/skip helpers —
# tool/ct_repo_lint_scan_contract.dart
shared_scan_notes:
  dart_contract: tool/ct_repo_lint_scan_contract.dart
  exclude_path_globs:
    - "**/test/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"

rules:
  - rule_id: repo.test_imports
    group: structure
    title: Test import convention (colonizethis_test first)
    spec: SPEC/program/test-logging.md
    runner: shell
    argv: [tool/check_test_imports.sh]

  - rule_id: repo.logic_ai_decoupling
    group: architecture
    title: colonizethis_logic / colonizethis_ai dependency boundary
    spec: SPEC/program/repo-and-packages.md
    runner: shell
    argv: [tool/check_logic_ai_decoupling.sh]

  - rule_id: repo.logic_dead_files
    group: architecture
    title: colonizethis_logic dead-file detection under lib/src
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_logic_dead_files.dart

  - rule_id: repo.logic_dedup_logger
    group: architecture
    title: colonizethis_logic must use shared logicLog (Refs #2391)
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_logic_dedup_logger.dart

  - rule_id: repo.ai_planner_context
    group: architecture
    title: colonizethis_ai domain planners must use PlannerContext (Refs #2521)
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_ai_planner_context.dart

  - rule_id: repo.dart_long_string_switches
    group: structure
    title: Long string-literal switch checks
    spec: SPEC/program/show-tech-tool.md
    runner: dart
    script: tool/check_long_string_switches.dart

  - rule_id: repo.app_lib_no_broad_suggest_work_orders
    group: architecture
    title: app/lib must not call broad suggestWorkOrders (Refs #2133)
    spec: SPEC/program/order-suggestions.md
    runner: shell
    argv: [tool/check_app_lib_no_suggest_work_orders.sh]

  - rule_id: repo.flutter_action_pins
    group: structure
    title: flutter-action workflow steps must pin flutter-version
    spec: SPEC/program/pub-workspace-toolchain.md
    runner: dart
    script: tool/check_flutter_action_pins.dart

  - rule_id: repo.workspace_outdated_resolvable
    group: structure
    title: workspace pub outdated current must match resolvable
    spec: SPEC/program/pub-workspace-toolchain.md
    runner: dart
    script: tool/check_workspace_outdated_resolvable.dart

  - rule_id: repo.workspace_outdated_latest_direct
    group: structure
    title: direct dependencies must be latest when latest is resolvable
    spec: SPEC/program/pub-workspace-toolchain.md
    runner: dart
    script: tool/check_workspace_outdated_latest_direct.dart

  - rule_id: repo.asset_path_constants
    group: identifiers
    title: Asset path constants in app runtime code
    spec: SPEC/program/repo-and-packages.md
    runner: dart
    script: tool/check_asset_path_constants.dart

  - rule_id: repo.tech_id_constants
    group: identifiers
    title: Tech ID literals must use generated constants
    spec: SPEC/program/repo-and-packages.md
    runner: dart
    script: tool/check_tech_id_constants.dart
    pr_incremental: true

  - rule_id: repo.work_target_constants
    group: identifiers
    title: Work target literals must use WorkTargetIds constants
    spec: SPEC/program/repo-and-packages.md
    runner: dart
    script: tool/check_work_target_constants.dart
    pr_incremental: true

  - rule_id: repo.civilian_unit_type_constants
    group: identifiers
    title: Civilian unit type literals must use constants
    spec: SPEC/program/repo-and-packages.md
    runner: dart
    script: tool/check_civilian_unit_type_constants.dart
    pr_incremental: true

  - rule_id: repo.naked_logger_usage
    group: structure
    title: No naked Logger( construction outside allowed files
    spec: SPEC/program/logging/logging.md
    runner: shell
    argv: [tool/check_naked_logger_usage.sh]

  - rule_id: repo.custom_exceptions
    group: exceptions
    title: Domain code must not throw generic exceptions
    spec: SPEC/program/exception-enforcement.md
    runner: dart
    script: tool/check_custom_exceptions.dart

  - rule_id: repo.disallowed_ast_patterns
    group: structure
    title: Disallowed AST patterns (manifest-driven)
    spec: SPEC/program/disallowed-ast-patterns.md
    runner: dart
    script: tool/check_disallowed_ast_patterns.dart
    pr_incremental: true

  - rule_id: repo.debug_console_logic_contract_boundary
    group: architecture
    title: debug console imports colonizethis_logic only via contracts
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_debug_console_logic_contract_boundary.dart
    pr_incremental: true

  - rule_id: repo.debug_console_shared_helpers
    group: structure
    title: debug console shared parse and executor helpers
    spec: SPEC/program/debug-console-internals.md
    runner: dart
    script: tool/check_debug_console_shared_helpers.dart

  - rule_id: repo.app_event_handler_scope_logic_boundary
    group: architecture
    title: app_event_handler_scope must not import features/game/logic directly
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_app_event_handler_scope_logic_boundary.dart

  - rule_id: repo.subscription_tracker
    group: structure
    title: app feature subscriptions must use SubscriptionTracker
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_subscription_tracker.dart

  - rule_id: repo.control_flow_nesting_depth
    group: structure
    title: Control-flow nesting depth (if/for/while/switch)
    spec: SPEC/program/control-flow-nesting-depth.md
    runner: dart
    script: tool/check_control_flow_nesting_depth.dart

  - rule_id: repo.repeated_magic_numbers
    group: structure
    title: Repeated magic integer literals (hash/LCG-style)
    spec: SPEC/program/repeated-magic-numbers.md
    runner: dart
    script: tool/check_repeated_magic_numbers.dart

  - rule_id: repo.function_size
    group: structure
    title: Function size threshold (measured lines)
    spec: SPEC/program/function-size.md
    runner: dart
    script: tool/check_function_size.dart

  - rule_id: repo.debug_handler_one_per_file
    group: structure
    title: Debug handler files export one applyDebug function
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_debug_handler_one_per_file.dart

  - rule_id: repo.part_unit_size
    group: structure
    title: Dart part fragment physical line limit (repo-lint domain)
    spec: SPEC/program/part-unit-size.md
    runner: dart
    script: tool/check_part_unit_size.dart

  - rule_id: repo.no_flame_in_widgets
    group: structure
    title: app/lib/widgets must not import package:flame directly
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_no_flame_in_widgets.dart

  - rule_id: repo.app_widget_imports
    group: structure
    title: app/lib/widgets must not import/export app/lib/features paths
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_app_widget_imports.dart

  - rule_id: repo.no_screen_in_game_widgets
    group: structure
    title: app/lib/features/game/widgets must not contain *_screen.dart files
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_no_screen_in_game_widgets.dart

  - rule_id: repo.game_widgets_file_size
    group: structure
    title: app/lib/features/game/widgets files must stay at or below 700 lines
    spec: SPEC/program/game-widgets-file-size.md
    runner: dart
    script: tool/check_game_widgets_file_size.dart

  - rule_id: repo.logic_test_file_size
    group: structure
    title: colonizethis_logic package tests must stay at or below 400 physical lines
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_logic_test_file_size.dart
    pr_incremental: true

  - rule_id: repo.dart_file_non_comment_line_size
    group: structure
    title: Dart files must stay at or below 1000 non-comment lines
    spec: SPEC/program/dart-file-non-comment-line-size.md
    runner: dart
    script: tool/check_dart_file_non_comment_line_size.dart
    pr_incremental: true

  - rule_id: repo.canonical_province_tile_keys
    group: game_invariants
    title: Province WorkOrder targetTileKey literals use full tile shape
    spec: SPEC/game/world-model-identity.md
    runner: dart
    script: tool/check_canonical_province_tile_keys.dart

  - rule_id: repo.colonizethis_map_lib_pipe_split
    group: structure
    title: colonizethis_map lib limits `.split('|')` to tile_key_util / map_pipe_string_util
    spec: SPEC/program/map-visualization.md
    runner: dart
    script: tool/check_colonizethis_map_lib_pipe_split.dart

  - rule_id: repo.tile_map_inline_cardinal_directions
    group: structure
    title: colonizethis_map lib uses kTileMapDirections4/8 instead of inline neighbor tuples
    spec: SPEC/program/tile-map-gen-algorithm.md
    runner: dart
    script: tool/check_tile_map_inline_cardinal_directions.dart
    pr_incremental: true

  - rule_id: repo.map_no_partfile_classes
    group: structure
    title: colonizethis_map lib/src part files must not declare non-private classes
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_map_no_partfile_classes.dart

  - rule_id: repo.land_province_bucket_keys
    group: game_invariants
    title: Canonical full-id land province bucket lookups in guarded paths
    spec: SPEC/program/fog-and-exploration-resolution.md
    runner: dart
    script: tool/check_land_province_bucket_keys.dart

  - rule_id: repo.app_ct_loading_indicator
    group: ui_structure
    title: app/lib must use CtLoadingIndicator instead of raw CircularProgressIndicator
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_app_ct_loading_indicator.dart

  - rule_id: repo.logic_dual_region_province_field_access
    group: architecture
    title: colonizethis_logic limits direct oldWorld/newWorld province list access
    spec: SPEC/program/logic-dual-region-province-access.md
    runner: dart
    script: tool/check_logic_dual_region_province_field_access.dart

  - rule_id: repo.logic_all_provinces_sanctioned_calls
    group: architecture
    title: colonizethis_logic allProvinces( call sites must be YAML-sanctioned
    spec: SPEC/program/logic-dual-region-province-access.md
    runner: dart
    script: tool/check_logic_all_provinces_sanctioned_calls.dart

  - rule_id: repo.app_hardcoded_ui_strings
    group: ui_i18n
    title: No hardcoded user-visible UI strings in app/lib (AST gate)
    spec: SPEC/program/localization.md
    runner: dart
    script: tool/check_app_hardcoded_ui_strings.dart
    include_only_when_env:
      name: CT_REPO_LINT_INCLUDE_APP
      value: "true"

  - rule_id: repo.app_no_duplicate_helpers
    group: structure
    title: "Canonical helpers from #2180 must not be redefined or duplicated"
    spec: SPEC/program/repo-lint.md
    runner: dart
    script: tool/check_app_no_duplicate_helpers.dart
