# Disallowed AST patterns — rules for tool/check_disallowed_ast_patterns.dart
# (YAML → rule model: tool/disallowed_ast_pattern_rules.dart)
# SPEC: SPEC/program/disallowed-ast-patterns.md
#
# Suppress: // ignore: disallowed_ast_<id>  or  // ignore_for_file: disallowed_ast_<id>

rules:
  - id: cascade_void_clear
    message: >-
      Do not use cascade ..clear(); use a separate .clear() statement or a new
      collection instance. Cascading void methods is misleading.
    match:
      kind: cascaded_method_invocation
      method_names:
        - clear
  - id: stream_where_is_map_as
    message: >-
      Do not chain .where((x) => x is T).map((x) => x as T); use
      .whereType<T>() on Stream or Iterable instead.
    match:
      kind: stream_where_is_map_as
  - id: avoid_print_suppression
    message: >-
      Do not suppress avoid_print via // ignore comments in runtime code.
      Route diagnostics through package logger instead.
    match:
      kind: comment_substring
      contains: "ignore: avoid_print"
  - id: strict_raw_types
    message: >-
      Do not use raw generic core types without explicit type arguments.
      Use concrete types such as List<int>, Map<String, Object?>, Set<Foo>,
      Future<Bar>, Stream<Baz>, or Iterable<Qux>.
    match:
      kind: raw_named_type
      type_names:
        - List
        - Map
        - Set
        - Iterable
        - Future
        - Stream
  - id: widget_build_method_too_long
    message: >-
      Do not allow widget build() method bodies above 60 physical lines.
      Extract sub-widgets or helper builders to keep build logic readable.
    match:
      kind: method_body_line_span
      function_name: build
      max_body_line_span: 60
      require_widget_class_extends: true
  - id: sea_zone_local_id_extraction
    message: >-
      Do not strip sea-zone ids to local form via ProvinceId.localIdFrom(...).
      Use canonical prefixed sea-zone ids (regionId|localSeaZoneId) for comparisons.
    match:
      kind: sea_zone_local_id_extraction
  - id: sea_zone_bucket_lookup_without_canonical_key
    message: >-
      Sea-zone tile bucket lookups must use canonical prefixed ids via
      canonicalizeSeaZoneId/canonicalSeaZoneTileBucketKey; local sea-zone keys are disallowed.
    match:
      kind: sea_zone_bucket_lookup_without_canonical_key
  - id: province_lookup_unprefixed_literal
    message: >-
      Do not pass unprefixed province id string literals to province lookup
      APIs. Use full province ids in the form regionId|localId.
    match:
      kind: unprefixed_province_id_string_literal_argument
      method_names:
        - getProvince
        - tryGetProvince
        - resolveToFullProvinceId
      argument_index: 1
  - id: province_local_id_from_unprefixed_literal
    message: >-
      Do not pass unprefixed province id string literals to
      ProvinceId.localIdFrom. Use full province ids in the form
      regionId|localId.
    match:
      kind: unprefixed_province_id_string_literal_argument
      method_names:
        - localIdFrom
      argument_index: 0
  - id: province_world_state_lookup_unprefixed_literal
    message: >-
      Do not pass unprefixed province id string literals to WorldState lookup
      methods. Use full province ids in the form regionId|localId.
    match:
      kind: unprefixed_province_id_string_literal_argument
      method_names:
        - tryGetProvince
        - getProvince
        - resolveToFullProvinceId
      argument_index: 0
  - id: province_local_segment_boundary_only
    message: >-
      ProvinceId.localSegmentFromStoredGameState(...) is disallowed.
      Normalize with explicit prefixed-id handling at call sites.
    match:
      kind: province_local_segment_boundary_only
  - id: no_complete_instant_civilian_order
    message: >-
      Do not reintroduce completeInstantCivilianOrder; civilian work primary
      effects must run on Build/Work completion (Refs #2070).
    match:
      kind: comment_substring
      contains: completeInstantCivilianOrder
  - id: debug_console_logic_contract_boundary
    message: >-
      Debug console code must import colonizethis_logic only through approved
      contract entrypoints. Imports from src/ internals and broad logic barrels
      are disallowed.
    match:
      kind: scoped_package_import_contract
      scoped_relative_path_prefixes:
        - packages/colonizethis_debug_console/lib/
      package_name: colonizethis_logic
      allowed_imports:
        - package:colonizethis_logic/debug_console_api.dart
  - id: logic_lib_list_queue_remove_at_zero
    message: >-
      Do not use a List named queue as a FIFO frontier (queue.removeAt(0) is
      O(n) per dequeue). Use dart:collection Queue with removeFirst() instead.
    match:
      kind: simple_receiver_remove_at_zero
      receiver_identifier: queue
      relative_path_prefix: packages/colonizethis_logic/lib/src/
  - id: prohibited_linear_province_lookup
    message: >-
      Do not perform linear province lookups via
      `.provinces.where(...).firstOrNull` (or `.firstWhere(...)`) inside
      packages/colonizethis_logic/lib/src/ or
      packages/colonizethis_orders/lib/src/. Use the O(1) province lookup
      helpers in `world/province_lookup.dart` (e.g. `tryGetProvince`,
      `getProvince`, `tryGetProvinceByRegion`) keyed by full province id.
    match:
      kind: linear_collection_where_first_or_null
      collection_names:
        - provinces
      relative_path_prefixes:
        - packages/colonizethis_logic/lib/src/
        - packages/colonizethis_orders/lib/src/
  - id: prohibited_linear_units_armies_fleets_lookup
    message: >-
      Do not perform linear scans on `.units`, `.armies`, or `.fleets` via
      `.where(...).firstOrNull` inside packages/colonizethis_logic/lib/src/
      or packages/colonizethis_orders/lib/src/. Build or reuse a
      `Map<String, Unit>` / `Map<String, Army>` / keyed fleet lookup (for
      example `unitsByIdFromWorld`, army maps on validators, or a one-shot
      index) so hot paths stay O(1) per id. Refs #2394,
      SPEC/program/order-suggestions.md.
    match:
      kind: linear_collection_where_first_or_null
      collection_names:
        - units
        - armies
        - fleets
      relative_path_prefixes:
        - packages/colonizethis_logic/lib/src/
        - packages/colonizethis_orders/lib/src/
  - id: prohibited_incremental_validator_per_item
    message: >-
      Do not call `IncrementalCandidateValidator.forPlayer` or
      `buildIncrementalCandidateValidator` inside a loop body in
      packages/colonizethis_logic/lib/src/ or
      packages/colonizethis_orders/lib/src/. Build one validator per suggestion
      pass (or hoist before the loop) and rebind with `forBasePrefix` when the
      trial `Orders` prefix changes. Refs #2394, SPEC/program/order-suggestions.md.
    match:
      kind: incremental_validator_for_player_in_loop
      relative_path_prefixes:
        - packages/colonizethis_logic/lib/src/
        - packages/colonizethis_orders/lib/src/
  - id: redundant_where_to_list_where_chain
    message: >-
      Do not chain `.where(...).toList().where(...)`; the intermediate
      `.toList()` allocates a `List` that the next `.where(...)` only
      re-iterates. Combine the predicates
      (`.where((x) => predA(x) && predB(x))`) or build the filtered list once
      via a single-pass accumulator. Refs #2575 Phase 5,
      SPEC/program/disallowed-ast-patterns.md.
    match:
      kind: redundant_where_to_list_where_chain
  - id: ai_full_recipe_catalog_scan
    message: >-
      Do not scan the full production recipe catalog via
      `ProductionRecipesCatalog.all` inside `packages/colonizethis_ai/lib/`.
      Use the O(1) output index `ProductionRecipesCatalog.producing(commodityId)`
      or the id index `ProductionRecipesCatalog.byId[recipeId]` so per-turn AI
      planning stays off the 15s next-turn budget hot path (Refs #3288,
      SPEC/program/disallowed-ast-patterns.md). A genuine
      all-recipes-must-be-considered loop may suppress with an inline
      `// ignore: disallowed_ast_ai_full_recipe_catalog_scan` and a rationale.
    match:
      kind: static_member_access
      type_name: ProductionRecipesCatalog
      member_name: all
      relative_path_prefix: packages/colonizethis_ai/lib/
  - id: nested_world_state_copywith
    message: >-
      Do not chain `Game.copyWith(worldState: ...copyWith(...copyWith(...)))`
      across three or more levels in `packages/colonizethis_logic/lib/`.
      Funnel multi-level world-state mutations through
      `Game.updateWorldState(...)` / `WorldState.updateTurnState(...)` (see
      `packages/colonizethis_world/lib/src/world/game_world_mutations.dart`)
      so each call site stays at one mutation level. Refs #2560,
      SPEC/program/disallowed-ast-patterns.md.
    match:
      kind: nested_world_state_copywith
      relative_path_prefix: packages/colonizethis_logic/lib/
      outer_argument_name: worldState
