name: check_gdd_coverage
description: Report which GDD specs (SPEC/game) are covered by sim_scenarios. SPEC/project/gdd-scenario-coverage.md.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  colonizethis_logger: any
  path: ^1.9.0

dev_dependencies:
  colonizethis_exception_lint:
    path: ../../packages/colonizethis_exception_lint
  custom_lint: 0.8.1

executables:
  check_gdd_coverage: bin/check_gdd_coverage.dart
