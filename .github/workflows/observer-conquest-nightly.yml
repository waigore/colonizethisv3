name: Observer conquest nightly

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  observer_conquest_verify:
    name: Full-AI 100-turn conquest verify (seed 42)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.11.0'

      - name: Resolve dependencies (workspace)
        run: dart pub get

      - name: Run observer game with conquest verification
        run: |
          set -e
          out="${RUNNER_TEMP}/observer-conquest"
          mkdir -p "$out"
          cd tool/run_observer_game
          dart run run_observer_game \
            --output "$out" \
            --seed 42 \
            --max-turns 100 \
            --verify-conquest
