name: Quality

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect source changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tests:
              - 'packages/**'
              - 'tool/sim_scenarios/**'
              - 'tool/sim_combat_montecarlo/**'
              - 'tool/sim_combat/**'
              - 'tool/generate_map/**'
              - 'tool/init_game/**'
              - 'tool/sim_economy/**'
              - 'tool/show_tech/**'
              - 'app/**'
              - 'ctdev/**'

      - name: Setup Flutter
        if: steps.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install melos
        if: steps.changes.outputs.tests == 'true'
        run: dart pub global activate melos

      - name: Check melos version
        if: steps.changes.outputs.tests == 'true'
        run: melos --version

      - name: Install lcov
        if: steps.changes.outputs.tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Check test import convention (SPEC/program/test-logging.md)
        run: tool/check_test_imports.sh

      - name: Run tests with coverage
        if: steps.changes.outputs.tests == 'true'
        #run: python3 tool/test_coverage.py
        run: echo disabled

      - name: Coverage gate (logic/map/ai >= 90%)
        if: steps.changes.outputs.tests == 'true'
        #run: tool/check_coverage_threshold.sh 90 packages/colonizethis_logic packages/colonizethis_map packages/colonizethis_ai
        run: echo disabled


      - name: sim_scenarios integration gate (all scenarios must pass)
        if: steps.changes.outputs.tests == 'true'
        run: melos run sim_scenarios
