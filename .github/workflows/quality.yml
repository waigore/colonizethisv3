name: Quality

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI quality scope: packages, app (Flutter widget tests), tool packages. Full scope via tool/run_quality_gate_tests.sh locally.
      - name: Detect source changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tests:
              - 'packages/**'
              - 'app/**'
              - 'ctterm/**'
              - 'tool/sim_scenarios/**'
              - 'tool/sim_combat_montecarlo/**'
              - 'tool/sim_combat/**'
              - 'tool/generate_map/**'
              - 'tool/init_game/**'
              - 'tool/sim_economy/**'
              - 'tool/show_tech/**'

      - name: Setup Flutter
        if: steps.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install melos
        if: steps.changes.outputs.tests == 'true'
        run: dart pub global activate melos

      - name: Check melos version
        if: steps.changes.outputs.tests == 'true'
        run: melos --version

      - name: Install lcov
        if: steps.changes.outputs.tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Resolve dependencies
        if: steps.changes.outputs.tests == 'true'
        run: dart pub get

      - name: Check test import convention (SPEC/program/test-logging.md)
        run: tool/check_test_imports.sh

      - name: Test colonizethis_models (Dart)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_models/test ]; then
            (cd packages/colonizethis_models && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_models && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_data (Dart)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_data/test ]; then
            (cd packages/colonizethis_data && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_data && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_save (Dart)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_save/test ]; then
            (cd packages/colonizethis_save && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_save && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_logic (Dart)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_logic/test ]; then
            (cd packages/colonizethis_logic && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_logic && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_ai (Dart)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_ai/test ]; then
            (cd packages/colonizethis_ai && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_ai && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_map (Dart)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_map/test ]; then
            (cd packages/colonizethis_map && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_map && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test ctterm (Dart)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          set -e
          if [ -d ctterm/test ]; then
            (cd ctterm && dart test -j 2 --reporter=compact)
          fi

      - name: Test tool packages (Dart)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          set -e
          for dir in tool/sim_scenarios tool/sim_combat_montecarlo tool/sim_combat tool/generate_map tool/init_game tool/sim_economy tool/show_tech; do
            [ -d "$dir/test" ] || continue
            (cd "$dir" && dart test -j 2 --reporter=compact)
          done

      - name: Test app (Flutter)
        if: steps.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          set -e
          if [ -d app ]; then
            (cd app && flutter test --coverage --reporter=compact)
          fi

      - name: App localization gate (flutter gen-l10n untranslated check)
        if: steps.changes.outputs.tests == 'true'
        run: |
          set -e
          if [ -d app ]; then
            cd app
            flutter gen-l10n
            if [ -f lib/l10n/untranslated.json ]; then
              # Fail if untranslated.json is non-empty (more than just {} or whitespace)
              content=$(cat lib/l10n/untranslated.json | tr -d '[:space:]')
              if [ "$content" != "{}" ] && [ "$content" != "" ]; then
                echo "Untranslated localization messages detected:"
                cat lib/l10n/untranslated.json
                exit 1
              fi
            fi
          fi

      - name: Compile app entrypoints (Flutter analyze)
        if: steps.changes.outputs.tests == 'true'
        run: |
          if [ -d app ]; then
            cd app
            # Run analyze but don't fail the step purely on its exit code.
            # We explicitly scan the output for "error" lines and gate on that.
            output=$(flutter analyze 2>&1 || true)
            echo "$output"
            error_count=$(echo "$output" | grep -c "^[[:space:]]*error" || true)
            if [ "$error_count" -gt 0 ]; then
              echo "Errors found: $error_count"
              exit 1
            fi
          fi

      - name: App coverage gate (app/lib/ >= 80%)
        if: steps.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 80 app

      - name: Coverage gate (logic/map/ai >= 90%)
        if: steps.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 90 packages/colonizethis_logic packages/colonizethis_map packages/colonizethis_ai

      - name: sim_scenarios integration gate (all scenarios must pass)
        if: steps.changes.outputs.tests == 'true'
        run: melos run sim_scenarios
