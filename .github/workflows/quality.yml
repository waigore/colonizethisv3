name: Quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
    branches:
      - main
      - dev

permissions:
  pull-requests: read

# Must match matrix shard list, app_tests_shard job name literal, and merge script below.
env:
  APP_TEST_TOTAL_SHARDS: "2"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      opencode_scope: ${{ steps.filter.outputs.opencode_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect source changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tests:
              - 'packages/**'
              - 'app/**'
              - 'tool/sim_scenarios/**'
              - 'tool/sim_combat_montecarlo/**'
              - 'tool/sim_combat/**'
              - 'tool/generate_map/**'
              - 'tool/init_game/**'
              - 'tool/sim_economy/**'
              - 'tool/show_tech/**'
              - 'tool/run_observer_game/**'
              - 'tool/check_long_string_switches.dart'
              - 'tool/generate_tech_effect_yaml.dart'
              - 'tool/generate_tech_effect_l10n.dart'
              - 'tool/embed_tech_effect_summary.dart'
              - 'tool/generate_order_engine_slots.dart'
              - 'tool/verify_order_engine_codegen.sh'
            # True when any changed path is outside repo-root dot-directories (CI/editor meta). OpenCode
            # review is skipped when the PR only touches those paths (e.g. .github, .cursor).
            opencode_scope:
              - '**'
              - '!.cursor/**'
              - '!.github/**'
              - '!.vscode/**'
              - '!.idea/**'
              - '!.husky/**'
  # Resolved pub cache + .dart_tool + gen-l10n; flutter analyze gate; then pack for shards (--no-pub).
  # `app_build_linux` reuses the same artifact to compile the Linux desktop target (release), catching
  # linker/gen-l10n issues that `flutter analyze` alone can miss.
  # Jobs always run after `changes` so required branch checks get success (not skip) when the path filter
  # excludes app/packages (e.g. SPEC-only PRs); heavy steps are gated on outputs.tests.
  app_tests_cache:
    name: App test cache (deps + l10n + analyze)
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Skip when no test-relevant paths changed
        if: needs.changes.outputs.tests != 'true'
        run: echo "No test-relevant paths matched; skipping app test cache."

      - name: Checkout
        if: needs.changes.outputs.tests == 'true'
        uses: actions/checkout@v6

      - name: Setup Flutter
        if: needs.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Resolve dependencies (workspace)
        if: needs.changes.outputs.tests == 'true'
        run: dart pub get

      - name: Generate app localizations
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          cd app
          flutter gen-l10n

      - name: Compile app entrypoints (Flutter analyze)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          if [ -d app ]; then
            cd app
            output=$(flutter analyze 2>&1 || true)
            echo "$output"
            error_count=$(echo "$output" | grep -c "^[[:space:]]*error" || true)
            if [ "$error_count" -gt 0 ]; then
              echo "Errors found: $error_count"
              exit 1
            fi
          fi

      - name: Pack cache for test shards
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          parts=()
          [ -d .pub-cache ] && parts+=(.pub-cache)
          [ -d .dart_tool ] && parts+=(.dart_tool)
          [ -d app/.dart_tool ] && parts+=(app/.dart_tool)
          [ -d app/lib/l10n ] && parts+=(app/lib/l10n)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Nothing to pack"
            exit 1
          fi
          tar czf app-test-cache.tar.gz "${parts[@]}"

      - name: Upload app test cache
        if: needs.changes.outputs.tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-test-cache
          path: app-test-cache.tar.gz
          retention-days: 2

  # Linux compile gate: parallel to `app_tests_shard` (same cache).
  # Add this job to branch protection if merges must wait on it.
  app_build_linux:
    name: App Linux desktop build (release)
    needs: [changes, app_tests_cache]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.tests != 'true' ||
        needs.app_tests_cache.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Skip when no test-relevant paths changed
        if: needs.changes.outputs.tests != 'true'
        run: echo "No test-relevant paths matched; skipping Linux desktop build."

      - name: Checkout
        if: needs.changes.outputs.tests == 'true'
        uses: actions/checkout@v6

      - name: Setup Flutter
        if: needs.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Install Linux desktop build dependencies
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Download app test cache
        if: needs.changes.outputs.tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-test-cache
          path: _app_test_cache

      - name: Restore pub + Dart tool cache
        if: needs.changes.outputs.tests == 'true'
        run: tar xzf _app_test_cache/app-test-cache.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Build Linux desktop (release)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -euo pipefail
          cd app
          # Gitignored linux/flutter/generated_plugins.cmake; workspace dart pub get does not emit it.
          flutter pub get
          flutter build linux --release --no-pub

      # Refs #2074: full assemble must not delete or rewrite tracked hand l10n (stale gen stamp regression).
      - name: Verify hand-maintained app l10n after Linux build
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -euo pipefail
          rels=(
            app/lib/l10n/app_localizations_en.dart
            app/lib/l10n/app_localizations_contract.dart
            app/lib/l10n/app_localizations_delegate.dart
            app/lib/l10n/l10n.dart
            app/lib/l10n/app_localizations_lookup.dart
            app/lib/l10n/app_localizations_en_part1.dart
            app/lib/l10n/app_localizations_en_part2.dart
            app/lib/l10n/app_localizations_en_part3.dart
            app/lib/l10n/app_localizations_en_part4.dart
            app/lib/l10n/app_localizations_en_part5.dart
          )
          for f in "${rels[@]}"; do
            test -f "$f" || { echo "missing tracked l10n file: $f"; exit 1; }
          done
          git diff --exit-code -- "${rels[@]}"

  app_tests_shard:
    # job.name cannot use env.* (GitHub limitation); keep "2" in sync with APP_TEST_TOTAL_SHARDS and matrix.shard.
    name: App tests (shard ${{ matrix.shard }}/2)
    needs: [changes, app_tests_cache]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.tests != 'true' ||
        needs.app_tests_cache.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      SUPPRESS_IMAGE_VIEWER: "1"
    steps:
      - name: Skip when no test-relevant paths changed
        if: needs.changes.outputs.tests != 'true'
        run: echo "No test-relevant paths matched; skipping app tests."

      - name: Checkout
        if: needs.changes.outputs.tests == 'true'
        uses: actions/checkout@v6

      - name: Setup Flutter
        if: needs.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Download app test cache
        if: needs.changes.outputs.tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-test-cache
          path: _app_test_cache

      - name: Restore pub + Dart tool cache
        if: needs.changes.outputs.tests == 'true'
        run: tar xzf _app_test_cache/app-test-cache.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Run Flutter tests (shard)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          mkdir -p app/coverage
          cd app
          # --no-pub: use packed .pub-cache + .dart_tool from app_tests_cache (same workspace path as build job).
          flutter test test/ --no-pub --coverage \
            --coverage-path=coverage/lcov.shard${{ matrix.shard }}.info \
            --reporter=compact -j 1 --no-track-widget-creation \
            --total-shards=${{ env.APP_TEST_TOTAL_SHARDS }} --shard-index=${{ matrix.shard }}

      - name: Upload shard coverage
        if: needs.changes.outputs.tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-lcov-shard-${{ matrix.shard }}
          path: app/coverage/lcov.shard${{ matrix.shard }}.info
          retention-days: 2

  quality:
    needs: changes
    runs-on: ubuntu-latest
    # Dart coverage + package matrix; Flutter app tests run in parallel shards (app_tests_shard).
    # Workspace analyzer runs flutter/dart analyze per member (many packages); allow enough time
    # so the job is not cancelled mid-analyze when the workspace grows (Refs #2036).
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Install melos
        if: needs.changes.outputs.tests == 'true'
        run: dart pub global activate melos

      - name: Check melos version
        if: needs.changes.outputs.tests == 'true'
        run: melos --version

      - name: Install lcov
        if: needs.changes.outputs.tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Resolve dependencies
        run: dart pub get

      - name: Workspace analyzer gate (errors only; includes test/ and integration_test/)
        run: dart run tool/run_workspace_analyze_errors_only.dart

      - name: Verify OrderEngine codegen (SPEC/program/order-engine.md)
        run: bash tool/verify_order_engine_codegen.sh

      # Regenerate `lib/l10n/gen/` before `ct_repo_lint` / NCL so analyzer-visible gen exists (Refs #2074).
      - name: App flutter gen-l10n (workspace parity)
        run: |
          set -e
          cd app
          flutter gen-l10n

      - name: Repo convention lint (unified manifest, SPEC/program/repo-lint.md)
        env:
          CT_REPO_LINT_INCLUDE_APP: ${{ needs.changes.outputs.tests }}
          CT_REPO_LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: dart run tool/ct_repo_lint.dart

      - name: Logic test file-size gate (<= 400 physical lines)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -euo pipefail
          mapfile -t changed_logic_tests < <(
            git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD -- \
              ':(glob)packages/colonizethis_logic/test/**/*.dart'
          )
          if [ "${#changed_logic_tests[@]}" -eq 0 ]; then
            echo "No changed colonizethis_logic tests; skipping size gate."
            exit 0
          fi
          dart run tool/check_logic_test_file_size.dart "${changed_logic_tests[@]}"

      - name: Run domain exception custom_lint (SPEC/program/exception-enforcement.md)
        run: bash tool/run_custom_lint_domain_exceptions.sh

      - name: Test checker suites (group 1/3)
        run: dart test packages/colonizethis_exception_lint/test --reporter=compact

      - name: Test checker suites (group 2/3)
        run: dart test test/check_*_test.dart --reporter=compact

      - name: Test checker suites (group 3/3)
        run: dart test test/ct_repo_lint*_test.dart --reporter=compact

      - name: Test OrderEngine slot generator (SPEC/program/order-engine.md)
        run: dart test test/generate_order_engine_slots_test.dart --reporter=compact

      - name: Wang incremental assets gate (Python)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
          cd pytool && python3 test_wang_incremental_assets_and_preview.py

      - name: Test colonizethis_models (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_models/test ]; then
            (cd packages/colonizethis_models && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_models && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_data (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_data/test ]; then
            (cd packages/colonizethis_data && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_data && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_save (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_save/test ]; then
            (cd packages/colonizethis_save && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_save && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_logic (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_logic/test ]; then
            (cd packages/colonizethis_logic && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_logic && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_ai (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_ai/test ]; then
            (cd packages/colonizethis_ai && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_ai && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_map (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_map/test ]; then
            (cd packages/colonizethis_map && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_map && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test run_observer_game (Dart, coverage)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          set -e
          (cd tool/run_observer_game && dart test --coverage=coverage -j 2 --reporter=compact)
          (cd tool/run_observer_game && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)

      - name: App localization gate (flutter gen-l10n untranslated check)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          if [ -d app ]; then
            cd app
            flutter gen-l10n
            if [ -f lib/l10n/gen/untranslated.json ]; then
              content=$(cat lib/l10n/gen/untranslated.json | tr -d '[:space:]')
              if [ "$content" != "{}" ] && [ "$content" != "" ]; then
                echo "Untranslated localization messages detected:"
                cat lib/l10n/gen/untranslated.json
                exit 1
              fi
            fi
          fi

      - name: Coverage gate (logic/map/ai >= 90%)
        if: needs.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 90 packages/colonizethis_logic packages/colonizethis_map packages/colonizethis_ai

      - name: Coverage gate (data >= 80%)
        if: needs.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 80 packages/colonizethis_data

      - name: Coverage gate (run_observer_game lib >= 80%)
        if: needs.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 80 tool/run_observer_game

  quality_app_coverage:
    name: App coverage (merge shards)
    needs: [changes, quality, app_tests_shard]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.quality.result == 'success' &&
      (
        needs.changes.outputs.tests != 'true' ||
        needs.app_tests_shard.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Skip when no test-relevant paths changed
        if: needs.changes.outputs.tests != 'true'
        run: echo "No test-relevant paths matched; skipping app coverage merge."

      - name: Checkout
        if: needs.changes.outputs.tests == 'true'
        uses: actions/checkout@v6

      - name: Install lcov
        if: needs.changes.outputs.tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Download shard coverage
        if: needs.changes.outputs.tests == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: app-lcov-shard-*
          merge-multiple: true
          path: _lcov_shards

      - name: Merge shard lcov into app/coverage/lcov.info
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -euo pipefail
          mkdir -p app/coverage
          mapfile -t shards < <(find _lcov_shards -type f -name 'lcov.shard*.info' | sort)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "No lcov.shard*.info files under _lcov_shards"
            exit 1
          fi
          cp "${shards[@]}" app/coverage/
          tool/merge_app_lcov_shards.sh "${APP_TEST_TOTAL_SHARDS}"

      - name: App coverage gate (app/lib/ >= 80%)
        if: needs.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 80 app

