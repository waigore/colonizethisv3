name: Quality

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  pull-requests: read

# Must match matrix shard list, app_tests_shard job name literal, and merge script below.
env:
  APP_TEST_TOTAL_SHARDS: "2"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect source changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tests:
              - 'packages/**'
              - 'app/**'
              - 'ctterm/**'
              - 'tool/sim_scenarios/**'
              - 'tool/sim_combat_montecarlo/**'
              - 'tool/sim_combat/**'
              - 'tool/generate_map/**'
              - 'tool/init_game/**'
              - 'tool/sim_economy/**'
              - 'tool/show_tech/**'

  # Resolved pub cache + .dart_tool + gen-l10n; flutter analyze gate; then pack for shards (--no-pub).
  app_tests_cache:
    name: App test cache (deps + l10n + analyze)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies (workspace)
        run: dart pub get

      - name: Generate app localizations
        run: |
          set -e
          cd app
          flutter gen-l10n

      - name: Compile app entrypoints (Flutter analyze)
        run: |
          set -e
          if [ -d app ]; then
            cd app
            output=$(flutter analyze 2>&1 || true)
            echo "$output"
            error_count=$(echo "$output" | grep -c "^[[:space:]]*error" || true)
            if [ "$error_count" -gt 0 ]; then
              echo "Errors found: $error_count"
              exit 1
            fi
          fi

      - name: Pack cache for test shards
        run: |
          set -e
          parts=()
          [ -d .pub-cache ] && parts+=(.pub-cache)
          [ -d .dart_tool ] && parts+=(.dart_tool)
          [ -d app/.dart_tool ] && parts+=(app/.dart_tool)
          [ -d app/lib/l10n ] && parts+=(app/lib/l10n)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Nothing to pack"
            exit 1
          fi
          tar czf app-test-cache.tar.gz "${parts[@]}"

      - name: Upload app test cache
        uses: actions/upload-artifact@v4
        with:
          name: app-test-cache
          path: app-test-cache.tar.gz
          retention-days: 2

  app_tests_shard:
    # job.name cannot use env.* (GitHub limitation); keep "2" in sync with APP_TEST_TOTAL_SHARDS and matrix.shard.
    name: App tests (shard ${{ matrix.shard }}/2)
    needs: [changes, app_tests_cache]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      SUPPRESS_IMAGE_VIEWER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download app test cache
        uses: actions/download-artifact@v4
        with:
          name: app-test-cache
          path: _app_test_cache

      - name: Restore pub + Dart tool cache
        run: tar xzf _app_test_cache/app-test-cache.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Run Flutter tests (shard)
        run: |
          set -e
          mkdir -p app/coverage
          cd app
          # --no-pub: use packed .pub-cache + .dart_tool from app_tests_cache (same workspace path as build job).
          flutter test --no-pub --coverage \
            --coverage-path=coverage/lcov.shard${{ matrix.shard }}.info \
            --reporter=compact -j 1 --no-track-widget-creation \
            --total-shards=${{ env.APP_TEST_TOTAL_SHARDS }} --shard-index=${{ matrix.shard }}

      - name: Upload shard coverage
        uses: actions/upload-artifact@v4
        with:
          name: app-lcov-shard-${{ matrix.shard }}
          path: app/coverage/lcov.shard${{ matrix.shard }}.info
          retention-days: 2

  quality:
    needs: changes
    runs-on: ubuntu-latest
    # Dart coverage + package matrix; Flutter app tests run in parallel shards (app_tests_shard).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: needs.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install melos
        if: needs.changes.outputs.tests == 'true'
        run: dart pub global activate melos

      - name: Check melos version
        if: needs.changes.outputs.tests == 'true'
        run: melos --version

      - name: Install lcov
        if: needs.changes.outputs.tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Resolve dependencies
        if: needs.changes.outputs.tests == 'true'
        run: dart pub get

      - name: Check test import convention (SPEC/program/test-logging.md)
        run: tool/check_test_imports.sh

      - name: Wang incremental assets gate (Python)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
          cd pytool && python3 test_wang_incremental_assets_and_preview.py

      - name: Test colonizethis_models (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_models/test ]; then
            (cd packages/colonizethis_models && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_models && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_data (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_data/test ]; then
            (cd packages/colonizethis_data && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_data && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_save (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_save/test ]; then
            (cd packages/colonizethis_save && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_save && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_logic (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_logic/test ]; then
            (cd packages/colonizethis_logic && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_logic && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_ai (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_ai/test ]; then
            (cd packages/colonizethis_ai && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_ai && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_map (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_map/test ]; then
            (cd packages/colonizethis_map && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_map && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test ctterm (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          set -e
          if [ -d ctterm/test ]; then
            (cd ctterm && dart test -j 2 --reporter=compact)
          fi

      - name: Test tool packages (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          set -e
          for dir in tool/sim_scenarios tool/sim_combat_montecarlo tool/sim_combat tool/generate_map tool/init_game tool/sim_economy tool/show_tech; do
            [ -d "$dir/test" ] || continue
            (cd "$dir" && dart test -j 2 --reporter=compact)
          done

      - name: App localization gate (flutter gen-l10n untranslated check)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          if [ -d app ]; then
            cd app
            flutter gen-l10n
            if [ -f lib/l10n/untranslated.json ]; then
              content=$(cat lib/l10n/untranslated.json | tr -d '[:space:]')
              if [ "$content" != "{}" ] && [ "$content" != "" ]; then
                echo "Untranslated localization messages detected:"
                cat lib/l10n/untranslated.json
                exit 1
              fi
            fi
          fi

      - name: Coverage gate (logic/map/ai >= 90%)
        if: needs.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 90 packages/colonizethis_logic packages/colonizethis_map packages/colonizethis_ai

      - name: sim_scenarios integration gate (all scenarios must pass)
        if: needs.changes.outputs.tests == 'true'
        run: melos run sim_scenarios

  quality_app_coverage:
    name: App coverage (merge shards)
    needs: [changes, quality, app_tests_shard]
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Download shard coverage
        uses: actions/download-artifact@v4
        with:
          pattern: app-lcov-shard-*
          merge-multiple: true
          path: _lcov_shards

      - name: Merge shard lcov into app/coverage/lcov.info
        run: |
          set -euo pipefail
          mkdir -p app/coverage
          mapfile -t shards < <(find _lcov_shards -type f -name 'lcov.shard*.info' | sort)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "No lcov.shard*.info files under _lcov_shards"
            exit 1
          fi
          cp "${shards[@]}" app/coverage/
          tool/merge_app_lcov_shards.sh "${APP_TEST_TOTAL_SHARDS}"

      - name: App coverage gate (app/lib/ >= 80%)
        run: tool/check_coverage_threshold.sh 80 app
