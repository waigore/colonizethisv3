name: Quality

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Check test import convention (SPEC/program/test-logging.md)
        run: tool/check_test_imports.sh

      - name: Run tests with coverage
        run: python3 tool/test_coverage.py

      - name: Coverage gate (colonizethis_logic >= 90%)
        run: tool/check_coverage_threshold.sh 90 packages/colonizethis_logic
