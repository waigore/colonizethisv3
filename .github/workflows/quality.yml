name: Quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
    branches:
      - main
      - dev

permissions:
  pull-requests: read

# Must match matrix shard list, app_tests_shard job name literal, and merge script below.
env:
  APP_TEST_TOTAL_SHARDS: "2"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      opencode_scope: ${{ steps.filter.outputs.opencode_scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect source changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tests:
              - 'packages/**'
              - 'app/**'
              - 'tool/sim_scenarios/**'
              - 'tool/sim_combat_montecarlo/**'
              - 'tool/sim_combat/**'
              - 'tool/generate_map/**'
              - 'tool/init_game/**'
              - 'tool/sim_economy/**'
              - 'tool/show_tech/**'
              - 'tool/check_long_string_switches.dart'
              - 'tool/generate_tech_effect_yaml.dart'
              - 'tool/generate_tech_effect_l10n.dart'
              - 'tool/embed_tech_effect_summary.dart'
              - 'tool/generate_order_engine_slots.dart'
              - 'tool/verify_order_engine_codegen.sh'
            # True when any changed path is outside repo-root dot-directories (CI/editor meta). OpenCode
            # review is skipped when the PR only touches those paths (e.g. .github, .cursor).
            opencode_scope:
              - '**'
              - '!.cursor/**'
              - '!.github/**'
              - '!.vscode/**'
              - '!.idea/**'
              - '!.husky/**'

  # Resolved pub cache + .dart_tool + gen-l10n; flutter analyze gate; then pack for shards (--no-pub).
  # `app_build_linux` reuses the same artifact to compile the Linux desktop target (release), catching
  # linker/gen-l10n issues that `flutter analyze` alone can miss.
  # Jobs always run after `changes` so required branch checks get success (not skip) when the path filter
  # excludes app/packages (e.g. SPEC-only PRs); heavy steps are gated on outputs.tests.
  app_tests_cache:
    name: App test cache (deps + l10n + analyze)
    needs: changes
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Skip when no test-relevant paths changed
        if: needs.changes.outputs.tests != 'true'
        run: echo "No test-relevant paths matched; skipping app test cache."

      - name: Checkout
        if: needs.changes.outputs.tests == 'true'
        uses: actions/checkout@v6

      - name: Setup Flutter
        if: needs.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies (workspace)
        if: needs.changes.outputs.tests == 'true'
        run: dart pub get

      - name: Generate app localizations
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          cd app
          flutter gen-l10n
          dart run ../tool/patch_app_localizations_after_gen_l10n.dart

      - name: Check long string switches (AST)
        if: needs.changes.outputs.tests == 'true'
        run: dart tool/check_long_string_switches.dart

      - name: Compile app entrypoints (Flutter analyze)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          if [ -d app ]; then
            cd app
            output=$(flutter analyze 2>&1 || true)
            echo "$output"
            error_count=$(echo "$output" | grep -c "^[[:space:]]*error" || true)
            if [ "$error_count" -gt 0 ]; then
              echo "Errors found: $error_count"
              exit 1
            fi
          fi

      - name: Pack cache for test shards
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          parts=()
          [ -d .pub-cache ] && parts+=(.pub-cache)
          [ -d .dart_tool ] && parts+=(.dart_tool)
          [ -d app/.dart_tool ] && parts+=(app/.dart_tool)
          [ -d app/lib/l10n ] && parts+=(app/lib/l10n)
          if [ ${#parts[@]} -eq 0 ]; then
            echo "Nothing to pack"
            exit 1
          fi
          tar czf app-test-cache.tar.gz "${parts[@]}"

      - name: Upload app test cache
        if: needs.changes.outputs.tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-test-cache
          path: app-test-cache.tar.gz
          retention-days: 2

  # Linux compile gate: parallel to `app_tests_shard` (same cache). Not wired into `app_e2e_linux`
  # (e2e job is intentionally a no-op); add this job to branch protection if merges must wait on it.
  app_build_linux:
    name: App Linux desktop build (release)
    needs: [changes, app_tests_cache]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.tests != 'true' ||
        needs.app_tests_cache.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - name: Skip when no test-relevant paths changed
        if: needs.changes.outputs.tests != 'true'
        run: echo "No test-relevant paths matched; skipping Linux desktop build."

      - name: Checkout
        if: needs.changes.outputs.tests == 'true'
        uses: actions/checkout@v6

      - name: Setup Flutter
        if: needs.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop build dependencies
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev

      - name: Download app test cache
        if: needs.changes.outputs.tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-test-cache
          path: _app_test_cache

      - name: Restore pub + Dart tool cache
        if: needs.changes.outputs.tests == 'true'
        run: tar xzf _app_test_cache/app-test-cache.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Build Linux desktop (release)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -euo pipefail
          cd app
          flutter build linux --release --no-pub

  app_tests_shard:
    # job.name cannot use env.* (GitHub limitation); keep "2" in sync with APP_TEST_TOTAL_SHARDS and matrix.shard.
    name: App tests (shard ${{ matrix.shard }}/2)
    needs: [changes, app_tests_cache]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.tests != 'true' ||
        needs.app_tests_cache.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      SUPPRESS_IMAGE_VIEWER: "1"
    steps:
      - name: Skip when no test-relevant paths changed
        if: needs.changes.outputs.tests != 'true'
        run: echo "No test-relevant paths matched; skipping app tests."

      - name: Checkout
        if: needs.changes.outputs.tests == 'true'
        uses: actions/checkout@v6

      - name: Setup Flutter
        if: needs.changes.outputs.tests == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download app test cache
        if: needs.changes.outputs.tests == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-test-cache
          path: _app_test_cache

      - name: Restore pub + Dart tool cache
        if: needs.changes.outputs.tests == 'true'
        run: tar xzf _app_test_cache/app-test-cache.tar.gz -C "$GITHUB_WORKSPACE"

      - name: Run Flutter tests (shard)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          mkdir -p app/coverage
          cd app
          # --no-pub: use packed .pub-cache + .dart_tool from app_tests_cache (same workspace path as build job).
          flutter test test/ --no-pub --coverage \
            --coverage-path=coverage/lcov.shard${{ matrix.shard }}.info \
            --reporter=compact -j 1 --no-track-widget-creation \
            --total-shards=${{ env.APP_TEST_TOTAL_SHARDS }} --shard-index=${{ matrix.shard }}

      - name: Upload shard coverage
        if: needs.changes.outputs.tests == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-lcov-shard-${{ matrix.shard }}
          path: app/coverage/lcov.shard${{ matrix.shard }}.info
          retention-days: 2

  # No integration_test runs: single skip step (see SPEC/program/e2e-integration-tests.md).
  app_e2e_linux:
    name: App e2e (Linux desktop + xvfb)
    needs: [changes, app_tests_shard]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.tests != 'true' ||
        needs.app_tests_shard.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip app e2e (temporarily disabled for CI stability/speed)
        run: |
          echo "app_e2e_linux gate intentionally skipped."
          echo "Reason: e2e tests are currently flaky and too slow for PR quality pace."
          echo "Behavior: this job remains as a required gate but does not execute integration_test suites."

  quality:
    needs: changes
    runs-on: ubuntu-latest
    # Dart coverage + package matrix; Flutter app tests run in parallel shards (app_tests_shard).
    # Workspace analyzer runs flutter/dart analyze per member (many packages); allow enough time
    # so the job is not cancelled mid-analyze when the workspace grows (Refs #2036).
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install melos
        if: needs.changes.outputs.tests == 'true'
        run: dart pub global activate melos

      - name: Check melos version
        if: needs.changes.outputs.tests == 'true'
        run: melos --version

      - name: Install lcov
        if: needs.changes.outputs.tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Resolve dependencies
        run: dart pub get

      - name: Workspace analyzer gate (errors only; includes test/ and integration_test/)
        run: dart run tool/run_workspace_analyze_errors_only.dart

      - name: Verify OrderEngine codegen (SPEC/program/order-engine.md)
        run: bash tool/verify_order_engine_codegen.sh

      # `flutter gen-l10n` overwrites tracked split layout; `ct_repo_lint` reads the
      # workspace tree (Refs #2021). Patch before repo lint so NCL matches committed shell.
      - name: Restore app l10n split after gen-l10n (NCL / analyze parity)
        run: |
          set -e
          cd app
          flutter gen-l10n
          dart run ../tool/patch_app_localizations_after_gen_l10n.dart

      - name: Repo convention lint (unified manifest, SPEC/program/repo-lint.md)
        env:
          CT_REPO_LINT_INCLUDE_APP: ${{ needs.changes.outputs.tests }}
          CT_REPO_LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: dart run tool/ct_repo_lint.dart

      - name: Run domain exception custom_lint (SPEC/program/exception-enforcement.md)
        run: bash tool/run_custom_lint_domain_exceptions.sh

      - name: Test colonizethis_exception_lint (SPEC/program/exception-enforcement.md)
        run: dart test packages/colonizethis_exception_lint/test --reporter=compact

      - name: Test disallowed AST patterns checker (SPEC/program/disallowed-ast-patterns.md)
        run: dart test test/check_disallowed_ast_patterns_test.dart --reporter=compact

      - name: Test repeated magic numbers checker (SPEC/program/repeated-magic-numbers.md)
        run: dart test test/check_repeated_magic_numbers_test.dart --reporter=compact

      - name: Test OrderEngine slot generator (SPEC/program/order-engine.md)
        run: dart test test/generate_order_engine_slots_test.dart --reporter=compact

      - name: Test app hardcoded UI string checker (SPEC/program/localization.md)
        run: dart test test/check_app_hardcoded_ui_strings_test.dart --reporter=compact

      - name: Test work target constants checker (SPEC/program/repo-and-packages.md)
        run: dart test test/check_work_target_constants_test.dart --reporter=compact

      - name: Test asset path constants checker (SPEC/program/repo-and-packages.md)
        run: dart test test/check_asset_path_constants_test.dart --reporter=compact

      - name: Test civilian unit type constants checker (SPEC/program/repo-and-packages.md)
        run: dart test test/check_civilian_unit_type_constants_test.dart --reporter=compact

      - name: Test canonical province tile-key checker (SPEC/game/world-model-identity.md)
        run: dart test test/check_canonical_province_tile_keys_test.dart --reporter=compact

      - name: Wang incremental assets gate (Python)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil
          cd pytool && python3 test_wang_incremental_assets_and_preview.py

      - name: Test colonizethis_models (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_models/test ]; then
            (cd packages/colonizethis_models && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_models && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_data (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_data/test ]; then
            (cd packages/colonizethis_data && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_data && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_save (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_save/test ]; then
            (cd packages/colonizethis_save && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_save && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_logic (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_logic/test ]; then
            (cd packages/colonizethis_logic && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_logic && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_ai (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_ai/test ]; then
            (cd packages/colonizethis_ai && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_ai && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test colonizethis_map (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          if [ -d packages/colonizethis_map/test ]; then
            (cd packages/colonizethis_map && dart test --coverage=coverage -j 2 --reporter=compact)
            (cd packages/colonizethis_map && dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info --report-on=lib --package=.)
          fi

      - name: Test tool packages (Dart)
        if: needs.changes.outputs.tests == 'true'
        env:
          SUPPRESS_IMAGE_VIEWER: "1"
        run: |
          set -e
          for dir in tool/sim_scenarios tool/sim_combat_montecarlo tool/sim_combat tool/generate_map tool/init_game tool/sim_economy tool/show_tech; do
            [ -d "$dir/test" ] || continue
            (cd "$dir" && dart test -j 2 --reporter=compact)
          done

      - name: App localization gate (flutter gen-l10n untranslated check)
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -e
          if [ -d app ]; then
            cd app
            flutter gen-l10n
            dart run ../tool/patch_app_localizations_after_gen_l10n.dart
            if [ -f lib/l10n/untranslated.json ]; then
              content=$(cat lib/l10n/untranslated.json | tr -d '[:space:]')
              if [ "$content" != "{}" ] && [ "$content" != "" ]; then
                echo "Untranslated localization messages detected:"
                cat lib/l10n/untranslated.json
                exit 1
              fi
            fi
          fi

      - name: Coverage gate (logic/map/ai >= 90%)
        if: needs.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 90 packages/colonizethis_logic packages/colonizethis_map packages/colonizethis_ai

      - name: sim_scenarios integration gate (all scenarios must pass)
        if: needs.changes.outputs.tests == 'true'
        run: melos run sim_scenarios

  quality_app_coverage:
    name: App coverage (merge shards)
    needs: [changes, quality, app_tests_shard]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.quality.result == 'success' &&
      (
        needs.changes.outputs.tests != 'true' ||
        needs.app_tests_shard.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Skip when no test-relevant paths changed
        if: needs.changes.outputs.tests != 'true'
        run: echo "No test-relevant paths matched; skipping app coverage merge."

      - name: Checkout
        if: needs.changes.outputs.tests == 'true'
        uses: actions/checkout@v6

      - name: Install lcov
        if: needs.changes.outputs.tests == 'true'
        run: sudo apt-get update && sudo apt-get install -y lcov

      - name: Download shard coverage
        if: needs.changes.outputs.tests == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: app-lcov-shard-*
          merge-multiple: true
          path: _lcov_shards

      - name: Merge shard lcov into app/coverage/lcov.info
        if: needs.changes.outputs.tests == 'true'
        run: |
          set -euo pipefail
          mkdir -p app/coverage
          mapfile -t shards < <(find _lcov_shards -type f -name 'lcov.shard*.info' | sort)
          if [ "${#shards[@]}" -eq 0 ]; then
            echo "No lcov.shard*.info files under _lcov_shards"
            exit 1
          fi
          cp "${shards[@]}" app/coverage/
          tool/merge_app_lcov_shards.sh "${APP_TEST_TOTAL_SHARDS}"

      - name: App coverage gate (app/lib/ >= 80%)
        if: needs.changes.outputs.tests == 'true'
        run: tool/check_coverage_threshold.sh 80 app

  # OpenCode post-quality review: same workflow as Quality; runs only for same-repo PRs into dev after
  # app_e2e_linux succeeds (currently a no-op required gate), when the PR changes paths outside dot-prefixed meta dirs (see changes.opencode_scope),
  # and when either the PR has the `help wanted` label or more than 10 files changed (otherwise skipped).
  # CI currently does not invoke OpenCode or enforce PR-comment verdicts (no-op); prompt is preserved on the job below.
  opencode_review:
    name: OpenCode review
    needs: [changes, app_e2e_linux]
    if: >-
      github.base_ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.opencode_scope == 'true' &&
      needs.app_e2e_linux.result == 'success' &&
      (contains(github.event.pull_request.labels.*.name, 'help wanted') || github.event.pull_request.changed_files > 10)
    runs-on: ubuntu-latest
    # Large PRs can exceed 45m (tooling + diff reads + a long sticky-comment PATCH); cancellation fails the verdict gate.
    timeout-minutes: 90
    permissions:
      pull-requests: write
      issues: write
      id-token: write
      # OpenCode ends with `git push` when the workspace has local commits; the checkout
      # token must allow contents writes and stay configured for HTTPS (persist-credentials).
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      # OpenCode invocation disabled (flaky); gate remains defined for branch protection / re-enable.
      # Original model: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode-go/minimax-m2.7' }} (see anomalyco/opencode/github@latest `with.model`).
      - name: Run OpenCode (PR review)
        run: |
          echo "OpenCode review gate is a no-op (OpenCode not invoked in CI)."
        env:
          # Preserved verbatim for restore; not passed to any runner service while disabled.
          OPENCODE_REVIEW_PROMPT_PRESERVED: |
            You are the final OpenCode reviewer for this pull request after the app_e2e_linux quality gate passed.

            The repository is checked out in the workspace. Read and apply these files in full:
            - .cursor/rules/colonizethis-code-review.mdc
            - .cursor/rules/colonizethis-component-structure.mdc

            Also verify:
            - The PR diff implements what linked closing issues and the PR description request (use GitHub context available to you).
            - SPEC documents under SPEC/ stay aligned with code for behavior touched by this diff.

            Deliverables (must all be satisfied):
            1) Put **all** detailed review text in **one** GitHub pull request **issue comment** on **this** pull request (use the PR number from the active review context, not linked issue numbers). Do not rely on CI or workflow logs for the long-form review; the PR comment is the source of truth for details.

            2) **Single sticky comment only**: If a PR issue comment already exists whose body contains the literal HTML marker `<!-- ct-opencode-quality-review -->`, **edit that same comment** with your updated review (keep the marker in the updated body). If none exists, create **one** new PR issue comment that includes that marker exactly once. **Do not** post any **other** new issue comments on this PR for this review (no follow-up “review complete”, session recap, or duplicate summaries—optional links may appear only inside that sticky comment body).

            3) **Comment body layout** (strict — CI parses line 1 and HTML markers):
            - **Line 1** must be exactly the ASCII word `PASS` or `FAIL` (uppercase, no backticks, no markdown, no leading/trailing spaces).
            - **Line 2** must be empty (no spaces).
            - **Line 3** must be exactly: `<!-- ct-opencode-quality-review -->`
            - **Line 4** must be exactly one of the following (must match line 1: use PASS line only with `PASS` on line 1, FAIL line only with `FAIL` on line 1):
              - `<!-- ct-opencode-verdict:PASS -->`
              - `<!-- ct-opencode-verdict:FAIL -->`
            - **Line 5** must be empty.
            - From **line 6** onward, use Markdown for the full human-readable review.

            4) Use line 1 `FAIL` and line 4 `<!-- ct-opencode-verdict:FAIL -->` if anything material must change before merge (bugs, spec violations, missing tests for critical behavior, violations of the rule files above, or mismatch with linked issue intent). Otherwise use `PASS` and `<!-- ct-opencode-verdict:PASS -->`.

  opencode_review_verdict:
    name: OpenCode review verdict
    needs: [opencode_review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Verdict parsing disabled with OpenCode no-op; prior jq/sed logic preserved in git history.
      - name: OpenCode review verdict (no-op)
        run: |
          echo "OpenCode review verdict gate is a no-op. opencode_review result: ${{ needs.opencode_review.result }}"
