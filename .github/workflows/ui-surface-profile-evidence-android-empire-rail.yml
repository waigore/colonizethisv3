name: UI surface profile evidence (Android empire-rail)

# Profile/release open-to-interactive evidence for empire-rail panels on Android
# emulator binding host (Refs #4688). Complements local/Linux replay via
# tool/run_ui_surface_profile_evidence.sh.
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev
    paths:
      # Empire-rail surfaces only — exclude GAME80001 (development) and MAP20001
      # (provinceOverlay) so shared perf/script edits do not queue a 90-minute
      # all-empire-rail batch ahead of surface-specific Android evidence (Refs #4687).
      - 'app/integration_test/trade_panel_surface_open_profile_test.dart'
      - 'app/integration_test/production_panel_surface_open_profile_test.dart'
      - 'app/integration_test/technology_panel_surface_open_profile_test.dart'
      - 'app/integration_test/diplomacy_panel_surface_open_profile_test.dart'
      - 'app/integration_test/victory_panel_surface_open_profile_test.dart'
      - 'app/integration_test/counsel_panel_surface_open_profile_test.dart'
      - 'app/integration_test/units_panels_surface_open_profile_test.dart'
      - 'app/lib/features/game/screens/production/**'
      - 'app/lib/features/game/screens/trade/**'
      - 'app/lib/features/game/screens/technology/**'
      - 'app/lib/features/game/screens/diplomacy/**'
      - 'app/lib/features/game/screens/victory/**'
      - 'app/lib/features/game/screens/counsel/**'
      - 'app/lib/widgets/ct_app_perf_interactive_ready_marker.dart'
      - 'tool/run_ui_surface_profile_evidence.sh'
      - '.github/workflows/ui-surface-profile-evidence-android-empire-rail.yml'

permissions:
  contents: read

# One Android emulator per PR ref — concurrent AVD boots on the same runner pool
# routinely miss the default boot deadline (Refs #4688).
concurrency:
  group: ui-surface-profile-android-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  empire_rail_android:
    name: Empire-rail profile open (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Resolve dependencies (workspace)
        run: dart pub get

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Run profile evidence on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            cd "$GITHUB_WORKSPACE"
            UI_SURFACE_PROFILE_OUT="$GITHUB_WORKSPACE/tmp/ui-surface-profile-evidence" bash tool/run_ui_surface_profile_evidence.sh all-empire-rail --host android
      - name: Upload profile evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-surface-profile-evidence-android-empire-rail
          path: tmp/ui-surface-profile-evidence/
          retention-days: 14

      - name: Print evidence summary
        if: success()
        run: |
          set -eu
          echo "=== ui_surface_open lines (Android emulator, empire-rail) ==="
          find tmp/ui-surface-profile-evidence -name '*.log' -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' log; do
                echo ""
                echo "--- $log ---"
                grep -E 'ui_surface_open surface=' "$log" || true
              done
