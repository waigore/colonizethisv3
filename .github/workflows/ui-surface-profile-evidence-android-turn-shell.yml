name: UI surface profile evidence (Android turn-shell)

# Profile/release open-to-interactive evidence for turn-shell surfaces
# DLG60001 / DLG50001 / OVL70001 on Android emulator binding host (Refs #4715).
# Complements local/Linux replay via tool/run_ui_surface_profile_evidence.sh.
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev
    paths:
      - 'app/integration_test/turn_shell_surface_open_profile_test.dart'
      - 'app/lib/features/game/turn_resolution/**'
      - 'app/lib/features/game/widgets/dialogs/turn_news_dialog.dart'
      - 'app/lib/features/game/widgets/shell/player_turn_event_feed*.dart'
      - 'app/lib/features/game/flame/map_state/game_map_area_turn_feed.dart'
      - 'app/lib/features/game/flame/map_state/player_turn_event_feed_session_cache.dart'
      - 'app/lib/features/game/flame/overlays/next_turn_confirmation_dialog.dart'
      - 'app/lib/widgets/ct_app_perf_interactive_ready_marker.dart'
      - 'packages/colonizethis_app_fixtures/lib/runtime/app_perf_trace.dart'
      - 'tool/run_ui_surface_profile_evidence.sh'
      - '.github/workflows/ui-surface-profile-evidence-android-turn-shell.yml'

permissions:
  contents: read

# One Android emulator per PR ref — concurrent AVD boots on the same runner pool
# routinely miss the default boot deadline (Refs #4715).
concurrency:
  group: ui-surface-profile-android-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  turn_shell_android:
    name: Turn-shell profile open (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Resolve dependencies (workspace)
        run: dart pub get

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Run profile evidence on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            cd "$GITHUB_WORKSPACE"
            UI_SURFACE_PROFILE_OUT="$GITHUB_WORKSPACE/tmp/ui-surface-profile-evidence" bash tool/run_ui_surface_profile_evidence.sh turn-shell --host android

      - name: Upload profile evidence logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-surface-profile-evidence-android-turn-shell
          path: tmp/ui-surface-profile-evidence/
          retention-days: 14

      - name: Print evidence summary
        if: success()
        run: |
          set -eu
          echo "=== ui_surface_open lines (Android emulator, turn-shell) ==="
          find tmp/ui-surface-profile-evidence -name '*.log' -type f -print0 \
            | sort -z \
            | while IFS= read -r -d '' log; do
                echo ""
                echo "--- $log ---"
                grep -E 'ui_surface_open surface=' "$log" || true
              done
