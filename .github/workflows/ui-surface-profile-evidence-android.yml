name: UI surface profile evidence (Android)

# Profile/release open-to-interactive evidence for GAME80001 on Android emulator
# binding host (Refs #4687). Complements local/Linux replay via
# tool/run_ui_surface_profile_evidence.sh.
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev
    paths:
      - 'app/integration_test/development_panel_surface_open_profile_test.dart'
      - 'app/lib/features/game/screens/development/**'
      # Shared perf marker/script omitted — turn-shell (#4715) and empire-rail
      # (#4688) workflows own those paths; avoid a 120-minute GAME80001 batch
      # ahead of surface-specific Android evidence on unrelated PRs (Refs #4715).
      - '.github/workflows/ui-surface-profile-evidence-android.yml'

permissions:
  contents: read

# One Android emulator per PR ref — concurrent AVD boots on the same runner pool
# routinely miss the default boot deadline (Refs #4687, #4688). Queue instead of
# cancel so turn-shell / empire-rail evidence on the same PR is not dropped
# (Refs #4715).
concurrency:
  group: ui-surface-profile-android-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  development_panel_android:
    name: GAME80001 profile open (Android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Resolve dependencies (workspace)
        run: dart pub get

      - name: Precache Android artifacts
        run: flutter precache --android

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses

      - name: Run profile evidence on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            cd "$GITHUB_WORKSPACE"
            UI_SURFACE_PROFILE_OUT="$GITHUB_WORKSPACE/tmp/ui-surface-profile-evidence" bash tool/run_ui_surface_profile_evidence.sh development --host android

      - name: Upload profile evidence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-surface-profile-evidence-android-development
          path: tmp/ui-surface-profile-evidence/
          retention-days: 14

      - name: Print evidence summary
        if: success()
        run: |
          set -eu
          log="$(find tmp/ui-surface-profile-evidence -name '*.log' -type f | sort | tail -1)"
          if [[ -z "$log" || ! -f "$log" ]]; then
            echo "ERROR: no profile evidence log under tmp/ui-surface-profile-evidence" >&2
            exit 1
          fi
          echo "=== ui_surface_open lines (Android emulator) ==="
          if ! grep -E 'ui_surface_open surface=' "$log"; then
            echo "ERROR: no ui_surface_open lines in $log" >&2
            exit 1
          fi
