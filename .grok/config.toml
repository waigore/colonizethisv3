# Project-scoped Grok configuration (ColonizeThis)
# Thin skill shims live in .grok/skills/ and delegate to the source of truth
# under .cursor/skills/. No extra paths or disables are required for normal use.
#
# MCP: dart/flutter also configured in ~/.grok/config.toml (user scope, absolute
# dart path). Project entry below pins the same server for this repo; same name
# replaces the user entry while working here.

[mcp_servers.dart]
command = "/Users/waigore/Documents/SDKs/flutter/bin/dart"
args = [
    "mcp-server",
    "--flutter-sdk",
    "/Users/waigore/Documents/SDKs/flutter",
    "--force-roots-fallback",
]
enabled = true
startup_timeout_sec = 60
