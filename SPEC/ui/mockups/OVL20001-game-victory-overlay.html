<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColonizeThis — Victory Overlay</title>
<style>
:root {
  --bg:        oklch(16% 0.018 50);
  --bg-deep:   oklch(12% 0.015 45);
  --surface:   oklch(24% 0.015 45);
  --surface-lite: oklch(30% 0.016 52);
  --fg:        oklch(88% 0.015 80);
  --muted:     oklch(65% 0.025 70);
  --border:    oklch(40% 0.02 55);
  --accent:    oklch(72% 0.14 85);
  --accent-dim: oklch(60% 0.12 82);
  --accent-bright: oklch(82% 0.13 90);
  --font-display: 'Iowan Old Style', 'Cinzel', 'Charter', Georgia, serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100vh; height:100dvh; background:var(--bg); color:var(--fg); font-family:var(--font-body); overflow:hidden; }

.underlay {
  position:absolute; inset:0; z-index:0;
  background:var(--bg-deep);
  background-image:
    linear-gradient(oklch(40% 0.02 55 / 0.06) 1px, transparent 1px),
    linear-gradient(90deg, oklch(40% 0.02 55 / 0.06) 1px, transparent 1px);
  background-size:48px 48px;
}

/* ── Scrim ── */
.scrim {
  position:absolute; inset:0; z-index:1;
  background:oklch(8% 0.01 30 / 0.75);
  display:flex; align-items:center; justify-content:center;
}

/* ── Victory panel ── */
.victory-panel {
  background:linear-gradient(180deg, var(--surface-lite) 0%, var(--bg-deep) 100%);
  border:2px solid var(--accent);
  padding:clamp(20px,4vw,36px) clamp(16px,4vw,32px);
  max-width:clamp(280px,88vw,460px);
  width:90%;
  text-align:center;
  z-index:2;
  box-shadow:
    0 0 30px oklch(65% 0.12 80 / 0.25),
    inset 0 1px 0 oklch(60% 0.08 80 / 0.08);
  position:relative;
}

/* Flourish corners */
.victory-panel::before,
.victory-panel::after {
  content:''; position:absolute;
  width:clamp(16px,3vw,24px); height:clamp(20px,3.5vw,28px);
  border-color:var(--accent); border-style:solid;
  opacity:0.7;
}
.victory-panel::before {
  top:4px; left:4px;
  border-width:1.5px 0 0 1.5px;
}
.victory-panel::after {
  bottom:4px; right:4px;
  border-width:0 1.5px 1.5px 0;
}

/* ── Laurel wreath decoration ── */
.laurel {
  font-size:clamp(24px,5vw,36px);
  color:var(--accent);
  margin-bottom:6px;
  opacity:0.6;
}
.laurel .leaf { margin:0 2px; }

/* ── Type ── */
.victory-type {
  font-family:var(--font-display);
  font-size:clamp(16px,3vw,22px);
  font-weight:700;
  letter-spacing:0.06em;
  color:var(--accent);
  margin-bottom:12px;
  text-transform:uppercase;
}
.brass-divider {
  width:clamp(100px,18vw,160px); height:1.5px;
  background:linear-gradient(90deg, transparent, var(--accent-dim) 15%, var(--accent) 50%, var(--accent-dim) 85%, transparent);
  margin:0 auto 14px;
}

.victory-body {
  font-family:var(--font-display);
  font-size:clamp(14px,2.2vw,18px);
  line-height:1.5;
  color:var(--fg);
  margin-bottom:clamp(16px,3vh,24px);
}
.victory-winner {
  color:var(--accent-bright);
  font-weight:700;
}

/* ── Buttons ── */
.victory-actions {
  display:flex; gap:clamp(6px,1.5vw,12px);
  justify-content:center;
  flex-wrap:wrap;
}
.victory-btn {
  padding:clamp(8px,1.5vh,12px) clamp(14px,2.5vw,20px);
  background:linear-gradient(180deg, var(--surface) 0%, var(--bg-deep) 100%);
  border:1px solid var(--accent-dim);
  color:var(--fg);
  font-family:var(--font-display);
  font-size:clamp(12px,1.8vw,14px);
  font-weight:600;
  letter-spacing:0.04em;
  cursor:pointer;
  transition:color 0.15s, border-color 0.15s, background 0.15s;
  min-width:clamp(120px,25vw,170px);
  -webkit-tap-highlight-color:transparent;
}
.victory-btn:hover {
  color:var(--accent-bright);
  border-color:var(--accent);
  background:linear-gradient(180deg, var(--surface-lite) 0%, var(--surface) 100%);
}
.victory-btn.secondary {
  border-color:var(--border);
  color:var(--muted);
}
.victory-btn.secondary:hover {
  border-color:var(--accent-dim);
  color:var(--fg);
}

/* ── Dismissed state ── */
.dismissed-text {
  display:none;
  position:absolute; inset:0; z-index:1;
  justify-content:center; align-items:center;
  font-family:var(--font-display);
  font-size:clamp(14px,2vw,18px);
  color:var(--accent-dim);
}
.dismissed-text.show { display:flex; }

.demo-bar {
  position:fixed; bottom:10px; right:10px; z-index:20;
  display:flex; gap:6px;
}
.demo-bar button {
  padding:4px 10px;
  background:var(--bg-deep); border:1px solid var(--border);
  color:var(--muted); font-family:var(--font-body); font-size:9px;
  cursor:pointer; letter-spacing:0.05em; transition:color 0.15s;
}
.demo-bar button:hover { color:var(--accent); }
</style>
</head>
<body>
<div class="underlay"></div>
<div class="scrim" id="scrim">
  <div class="victory-panel" id="panel">
    <div class="laurel">
      <span class="leaf">&#x269C;</span>
      <span class="leaf">&#9733;</span>
      <span class="leaf">&#x269C;</span>
    </div>
    <div class="victory-type">Military Victory</div>
    <div class="brass-divider"></div>
    <div class="victory-body">
      <span class="victory-winner" id="winnerName">England</span> has achieved supremacy by military conquest.
      <br><br>
      Final turn: <strong>42</strong> &mdash; Year <strong>1650</strong>
    </div>
    <div class="victory-actions">
      <button class="victory-btn" onclick="handleReturnToMenu()">Return to Main Menu</button>
      <button class="victory-btn secondary" onclick="handleViewFinalState()">View Final State</button>
    </div>
  </div>
</div>

<div class="dismissed-text" id="dismissedText">
  Victory overlay dismissed — map remains visible
</div>

<div class="demo-bar">
  <button onclick="resetOverlay()">Reset</button>
</div>

<script>
function handleReturnToMenu() {
  alert('Navigating to main menu...\n(Emit NavigateToShellEvent)');
}
function handleViewFinalState() {
  document.getElementById('scrim').style.display = 'none';
  document.getElementById('dismissedText').classList.add('show');
}
function resetOverlay() {
  document.getElementById('scrim').style.display = 'flex';
  document.getElementById('dismissedText').classList.remove('show');
}
</script>
</body>
</html>
