<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColonizeThis — Empire Overview</title>
<style>
:root {
  --bg: oklch(16% 0.018 50); --bg-deep: oklch(12% 0.015 45);
  --surface: oklch(24% 0.015 45); --surface-lite: oklch(30% 0.016 52);
  --fg: oklch(88% 0.015 80); --muted: oklch(65% 0.025 70);
  --border: oklch(40% 0.02 55); --accent: oklch(72% 0.14 85); --accent-dim: oklch(60% 0.12 82);
  --font-display: 'Iowan Old Style','Cinzel','Charter',Georgia,serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden}
/* Map area */
.map{position:fixed;inset:0;z-index:0;display:flex;flex-direction:column}
.map-content{flex:1;position:relative;background:radial-gradient(ellipse at 20% 80%,oklch(28% 0.02 40 / 0.25) 0%,transparent 60%),radial-gradient(ellipse at 85% 15%,oklch(25% 0.015 55 / 0.2) 0%,transparent 55%),var(--bg)}
.map-content::after{content:'';position:absolute;inset:0;background-image:linear-gradient(oklch(40% 0.02 55 / 0.06) 1px,transparent 1px),linear-gradient(90deg,oklch(40% 0.02 55 / 0.06) 1px,transparent 1px);background-size:80px 80px}
.map-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:clamp(24px,4vw,36px);font-weight:700;color:var(--accent);opacity:0.4;text-align:center}
/* Region tabs bar */
.tabbar{display:flex;align-items:center;gap:0;padding:0 10px;background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 100%);border-bottom:2px solid var(--accent-dim);z-index:2;flex-wrap:wrap}
.tab{flex:1;min-width:80px;padding:10px 12px;background:none;border:none;color:var(--muted);font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:0.05em;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color 0.15s,border-color 0.15s}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.tab:hover{color:var(--fg)}
.tabbar .indicators{display:flex;align-items:center;gap:12px;margin-left:auto;padding-right:10px;font-size:12px;color:var(--muted)}.tabbar .indicators .val{font-family:monospace;color:var(--fg);font-weight:600}
/* Bottom-left controls */
.controls{position:absolute;bottom:10px;left:10px;z-index:3;display:flex;gap:8px}
.ctrl-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--surface-lite);border:1px solid var(--accent-dim);color:var(--accent-dim);cursor:pointer;transition:color 0.15s}.ctrl-btn:hover{color:var(--accent)}
.ctrl-btn img{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}
/* Minimap placeholder */
.minimap{position:absolute;bottom:10px;right:10px;z-index:3;width:clamp(100px,15vw,160px);height:clamp(80px,12vw,120px);background:var(--bg-deep);border:1px solid var(--accent-dim);opacity:0.6;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);font-family:monospace}
</style>
</head>
<body>
<div class="map">
  <div class="tabbar">
    <button class="tab active" onclick="switchRegion(event,'ow')">Old World</button>
    <button class="tab" onclick="switchRegion(event,'nw')">New World</button>
    <div class="indicators">
      <span>Treasury: <span class="val" id="treasury">&#xa3;8,420</span></span>
      <span>Cargo: <span class="val">3/12</span></span>
    </div>
  </div>
  <div class="map-content">
    <div class="map-label" id="region-label">Old World</div>
    <div class="controls">
      <button class="ctrl-btn" title="Layer toggle"><img src="icons/32/ui_icon_layer_toggle.png" alt="layers"></button>
      <button class="ctrl-btn" title="Go to capital"><img src="icons/32/ui_icon_home_capital.png" alt="home"></button>
      <button class="ctrl-btn" title="Map options"><img src="icons/32/ui_icon_map_options.png" alt="options"></button>
    </div>
    <div class="minimap">Region Minimap</div>
  </div>
</div>
<script>
function switchRegion(e,r){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'))
  e.target.classList.add('active')
  document.getElementById('region-label').textContent=r==='ow'?'Old World':'New World'
}
let showExact=true
document.getElementById('treasury').onclick=function(){
  showExact=!showExact
  this.textContent=showExact?'\u00a38,420':'\u00a38.4k'
}
</script>
</body>
</html>
