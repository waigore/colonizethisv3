<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColonizeThis — Save Game Name (DLG70001)</title>
<style>
:root {
  --bg: oklch(16% 0.018 50); --bg-deep: oklch(12% 0.015 45);
  --surface: oklch(24% 0.015 45); --surface-lite: oklch(30% 0.016 52);
  --fg: oklch(88% 0.015 80); --muted: oklch(65% 0.025 70);
  --accent: oklch(72% 0.14 85); --accent-dim: oklch(60% 0.12 82);
  --font-display: 'Iowan Old Style','Cinzel',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.scrim{position:fixed;inset:0;background:oklch(0% 0 0 / 0.55)}
.shell{position:relative;z-index:1;width:min(360px,92vw);padding:20px;background:linear-gradient(180deg,var(--surface-lite),var(--surface) 40%,var(--bg-deep));border:2px solid var(--accent-dim)}
h1{font-family:var(--font-display);color:var(--accent);font-size:1.1rem;text-align:center;margin-bottom:14px}
input{width:100%;padding:10px;background:var(--bg-deep);border:1px solid var(--accent-dim);color:var(--fg);margin-bottom:16px}
.row{display:flex;gap:10px;justify-content:flex-end}
button{padding:8px 14px;background:linear-gradient(180deg,var(--surface-lite),var(--bg-deep));border:1px solid var(--accent-dim);color:var(--fg);font-family:var(--font-display);cursor:pointer}
</style>
</head>
<body>
<div class="scrim"></div>
<div class="shell">
  <h1>Save Game</h1>
  <input value="England - Queen Victoria - 3" aria-label="Save name">
  <div class="row">
    <button type="button">Cancel</button>
    <button type="button">Save</button>
  </div>
</div>
</body>
</html>
