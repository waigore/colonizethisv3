<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColonizeThis — Commodity Breakdown</title>
<style>
:root {
  --bg: oklch(16% 0.018 50); --bg-deep: oklch(12% 0.015 45);
  --surface: oklch(24% 0.015 45); --surface-lite: oklch(30% 0.016 52);
  --fg: oklch(88% 0.015 80); --muted: oklch(65% 0.025 70);
  --border: oklch(40% 0.02 55); --accent: oklch(72% 0.14 85); --accent-dim: oklch(60% 0.12 82);
  --font-display: 'Iowan Old Style','Cinzel','Charter',Georgia,serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --positive: oklch(58% 0.14 140); --negative: oklch(58% 0.16 22);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;overflow:hidden}
.scrim{position:fixed;inset:0;background:oklch(0% 0 0 / 0.6);z-index:0}
.dialog{position:relative;z-index:1;width:min(96vw,720px);max-height:90vh;background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 8%,var(--bg-deep) 100%);border:2px solid var(--accent-dim);padding:16px;display:flex;flex-direction:column}
.dialog h3{font-family:var(--font-display);font-size:clamp(16px,2.2vw,20px);font-weight:700;letter-spacing:0.05em;color:var(--accent);text-align:center;margin-bottom:12px}
.table-wrap{flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:600px;table-layout:fixed}
/* Wide-path column distribution (Refs #3509): Commodity column gets a larger
   share (~2x); the five phase columns + Total share the remainder evenly. */
th:first-child,td:first-child{width:25%}
th:not(:first-child),td:not(:first-child){width:12.5%}
th{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 10px;border-bottom:2px solid var(--accent-dim);background:var(--surface);position:sticky;top:0}
th:first-child{text-align:left}
.section-hdr td{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--accent-dim);padding:10px 10px 6px;background:var(--bg-deep);border-bottom:1px solid var(--border)}
td{padding:6px 10px;font-family:monospace;font-size:11px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
td:first-child{text-align:left;font-family:var(--font-body);font-size:12px;color:var(--fg);display:flex;align-items:center;gap:6px}
.com-icon{width:18px;height:18px;flex-shrink:0;background:var(--surface-lite);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px}
.positive{color:var(--positive)}.negative{color:var(--negative)}.zero{color:var(--muted)}
.total{font-weight:700;color:var(--fg)}
.actions{display:flex;justify-content:flex-end;margin-top:12px}
.btn{padding:10px 24px;background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 40%,var(--bg-deep) 100%);border-top:1.5px solid var(--accent-dim);border-bottom:1.5px solid var(--accent-dim);color:var(--fg);font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:0.06em;cursor:pointer;border-left:none;border-right:none;transition:color 0.15s}.btn:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="scrim" onclick="location.reload()"></div>
<div class="dialog">
  <h3>Commodity breakdown</h3>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Commodity</th>
          <th>Pending</th>
          <th>Extraction</th>
          <th>Riches</th>
          <th>Consumption</th>
          <th>Production</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr class="section-hdr"><td colspan="7">Food</td></tr>
        <tr><td><span class="com-icon">&#x1F33E;</span>Grain</td><td class="zero">0</td><td class="positive">+8</td><td class="zero">0</td><td class="negative">&#x2212;4</td><td class="zero">0</td><td class="total positive">+4</td></tr>
        <tr><td><span class="com-icon">&#x1F356;</span>Meat</td><td class="zero">0</td><td class="positive">+3</td><td class="zero">0</td><td class="negative">&#x2212;2</td><td class="zero">0</td><td class="total positive">+1</td></tr>
        <tr class="section-hdr"><td colspan="7">Raw materials</td></tr>
        <tr><td><span class="com-icon">&#x1FAB5;</span>Timber</td><td class="negative">&#x2212;6</td><td class="positive">+10</td><td class="zero">0</td><td class="negative">&#x2212;4</td><td class="zero">0</td><td class="total zero">0</td></tr>
        <tr><td><span class="com-icon">&#x1F9F1;</span>Iron</td><td class="zero">0</td><td class="positive">+5</td><td class="zero">0</td><td class="negative">&#x2212;3</td><td class="zero">0</td><td class="total positive">+2</td></tr>
        <tr><td><span class="com-icon">&#x1F9F6;</span>Wool</td><td class="zero">0</td><td class="positive">+6</td><td class="zero">0</td><td class="negative">&#x2212;4</td><td class="zero">0</td><td class="total positive">+2</td></tr>
        <tr><td><span class="com-icon">&#x1FAA8;</span>Cotton</td><td class="zero">0</td><td class="positive">+4</td><td class="zero">0</td><td class="negative">&#x2212;4</td><td class="zero">0</td><td class="total zero">0</td></tr>
        <tr><td><span class="com-icon">&#x26CF;</span>Coal</td><td class="zero">0</td><td class="positive">+3</td><td class="zero">0</td><td class="negative">&#x2212;1</td><td class="zero">0</td><td class="total positive">+2</td></tr>
        <tr class="section-hdr"><td colspan="7">Manufactured</td></tr>
        <tr><td><span class="com-icon">&#x1FA9A;</span>Lumber</td><td class="negative">&#x2212;4</td><td class="zero">0</td><td class="zero">0</td><td class="negative">&#x2212;1</td><td class="positive">+6</td><td class="total positive">+1</td></tr>
        <tr><td><span class="com-icon">&#x1F9F5;</span>Fabric</td><td class="negative">&#x2212;2</td><td class="zero">0</td><td class="zero">0</td><td class="negative">&#x2212;2</td><td class="positive">+4</td><td class="total zero">0</td></tr>
        <tr><td><span class="com-icon">&#x1F4DC;</span>Paper</td><td class="negative">&#x2212;3</td><td class="zero">0</td><td class="zero">0</td><td class="zero">0</td><td class="positive">+3</td><td class="total zero">0</td></tr>
      </tbody>
    </table>
  </div>
  <div class="actions"><button class="btn" onclick="location.reload()">Close</button></div>
</div>
</body>
</html>
