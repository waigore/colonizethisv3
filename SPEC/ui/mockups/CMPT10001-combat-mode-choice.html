<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColonizeThis — Combat Mode Choice</title>
<style>
:root {
  --bg: oklch(16% 0.018 50); --bg-deep: oklch(12% 0.015 45);
  --surface: oklch(24% 0.015 45); --surface-lite: oklch(30% 0.016 52);
  --fg: oklch(88% 0.015 80); --muted: oklch(65% 0.025 70);
  --border: oklch(40% 0.02 55); --accent: oklch(72% 0.14 85); --accent-dim: oklch(60% 0.12 82);
  --font-display: 'Iowan Old Style','Cinzel','Charter',Georgia,serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;overflow:hidden}
.scrim{position:fixed;inset:0;background:oklch(0% 0 0 / 0.6);z-index:0}
.dialog{position:relative;z-index:1;width:min(88vw,400px);background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 20%,var(--bg-deep) 100%);border:2px solid var(--accent-dim);padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:14px}
.dialog h3{font-family:var(--font-display);font-size:clamp(18px,2.5vw,22px);font-weight:700;letter-spacing:0.05em;color:var(--accent)}
.dialog p{font-size:13px;color:var(--muted);line-height:1.5}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 22px;font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:0.06em;cursor:pointer;border:none;transition:color 0.15s}
.btn-auto{background:linear-gradient(180deg,var(--surface) 0%,var(--bg-deep) 100%);border-top:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--muted)}.btn-auto:hover{color:var(--fg)}
.btn-qb{background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 40%,var(--bg-deep) 100%);border-top:1.5px solid var(--accent-dim);border-bottom:1.5px solid var(--accent-dim);color:var(--fg)}.btn-qb:hover{color:var(--accent)}
/* Siege variant */
.siege-note{font-size:12px;color:oklch(58% 0.16 22);font-style:italic}
</style>
</head>
<body>
<div class="scrim"></div>
<div class="dialog" id="regular">
  <h3>Combat at Lisbon</h3>
  <p>Choose how to resolve this combat.</p>
  <div class="actions">
    <button class="btn btn-auto" onclick="alert('Auto-resolving...');location.reload()">Auto-Resolve</button>
    <button class="btn btn-qb" onclick="location.href='quick-battle-screen.html'">Quick Battle</button>
  </div>
</div>
</body>
</html>
