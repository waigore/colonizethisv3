<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColonizeThis — Game Side Menu</title>
<style>
:root {
  --bg: oklch(16% 0.018 50); --bg-deep: oklch(12% 0.015 45);
  --surface: oklch(24% 0.015 45); --surface-lite: oklch(30% 0.016 52);
  --fg: oklch(88% 0.015 80); --muted: oklch(65% 0.025 70);
  --border: oklch(40% 0.02 55); --accent: oklch(72% 0.14 85); --accent-dim: oklch(60% 0.12 82);
  --font-display: 'Iowan Old Style','Cinzel','Charter',Georgia,serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden}
/* Fake map background */
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 20% 80%,oklch(28% 0.02 40 / 0.25) 0%,transparent 60%),radial-gradient(ellipse at 85% 15%,oklch(25% 0.015 55 / 0.2) 0%,transparent 55%),var(--bg)}
.bg::after{content:'';position:absolute;inset:0;background-image:linear-gradient(oklch(40% 0.02 55 / 0.06) 1px,transparent 1px),linear-gradient(90deg,oklch(40% 0.02 55 / 0.06) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse at 50% 50%,black 30%,transparent 80%)}
/* Slide-out menu */
.menu{position:fixed;z-index:10;top:0;bottom:0;left:0;width:240px;background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 20%,var(--bg-deep) 100%);border-right:2px solid var(--accent-dim);padding:12px 8px;display:flex;flex-direction:column;gap:8px;transform:translateX(0);transition:transform 0.2s}
.menu.closed{transform:translateX(-100%)}
.menu .close-row{display:flex;justify-content:flex-end}
.menu .close-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:16px;font-family:var(--font-body)}.menu .close-btn:hover{color:var(--accent);border-color:var(--accent-dim)}
.menu .spacer{height:8px}
.menu-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 40%,var(--bg-deep) 100%);border-top:1.5px solid var(--accent-dim);border-bottom:1.5px solid var(--accent-dim);color:var(--fg);font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:0.05em;cursor:pointer;transition:color 0.15s}.menu-btn:hover{color:var(--accent)}
.menu-btn .icon{width:20px;height:20px;flex-shrink:0;color:var(--accent-dim)}
.toggle-btn{position:fixed;top:16px;left:16px;z-index:9;width:36px;height:36px;background:var(--surface-lite);border:1px solid var(--accent-dim);color:var(--accent-dim);cursor:pointer;font-family:var(--font-body);font-size:18px;display:flex;align-items:center;justify-content:center}.toggle-btn:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="menu" id="menu">
  <div class="close-row">
    <button class="close-btn" onclick="toggleMenu()">&#xd7;</button>
  </div>
  <div class="spacer"></div>
  <button class="menu-btn" onclick="alert('Game Parameters: Infinite mode is OFF');toggleMenu()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Game Parameters
  </button>
  <button class="menu-btn" onclick="alert('Navigate to Debug Log');toggleMenu()">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    Debug log
  </button>
</div>
<button class="toggle-btn" id="toggle" onclick="toggleMenu()">&#x2261;</button>
<script>
let open=true
function toggleMenu(){
  open=!open
  document.getElementById('menu').classList.toggle('closed',!open)
  document.getElementById('toggle').style.display=open?'none':'flex'
}
</script>
</body>
</html>
