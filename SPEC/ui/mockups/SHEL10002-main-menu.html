<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColonizeThis — Main Menu</title>
<style>
/* ── Direction: editorial-monocle + nautical / brass / mahogany ── */
:root {
  --bg:        oklch(16% 0.018 50);
  --bg-deep:   oklch(12% 0.015 45);
  --surface:   oklch(24% 0.015 45);
  --surface-lite: oklch(30% 0.016 52);
  --fg:        oklch(88% 0.015 80);
  --muted:     oklch(65% 0.025 70);
  --border:    oklch(40% 0.02 55);
  --accent:    oklch(72% 0.14 85);
  --accent-dim: oklch(60% 0.12 82);
  --accent-bright: oklch(82% 0.13 90);

  --font-display: 'Iowan Old Style', 'Cinzel', 'Charter', Georgia, serif;
  --font-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --font-mono:    'SF Mono', ui-monospace, Menlo, monospace;

  --menu-max: 400px;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  overflow-x: hidden;
}

html { overflow-y: auto; scroll-behavior: smooth; }

/* ── Background layer ── */
.background {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 80%, oklch(28% 0.02 40 / 0.25) 0%, transparent 60%),
    radial-gradient(ellipse at 85% 15%, oklch(25% 0.015 55 / 0.2) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, oklch(14% 0.012 48 / 0.6) 0%, transparent 70%),
    var(--bg);
  overflow: hidden;
}

/* Nautical compass rose — decorative */
.background::before {
  content: '';
  position: absolute;
  right: 5vw; bottom: 5vw;
  width: min(380px, 40vw); height: min(380px, 40vw);
  background:
    conic-gradient(
      from 22.5deg,
      oklch(40% 0.04 55 / 0.18) 0deg 45deg,
      transparent 45deg 90deg,
      oklch(40% 0.04 55 / 0.18) 90deg 135deg,
      transparent 135deg 180deg,
      oklch(40% 0.04 55 / 0.18) 180deg 225deg,
      transparent 225deg 270deg,
      oklch(40% 0.04 55 / 0.18) 270deg 315deg,
      transparent 315deg 360deg
    );
  border-radius: 50%;
  border: 1px solid oklch(40% 0.04 55 / 0.25);
  opacity: 0.35;
  transform: rotate(-12deg);
  pointer-events: none;
}

/* Subtle map grid lines */
.background::after {
  content: '';
  position: absolute; inset: 0;
  background-image:
    linear-gradient(oklch(40% 0.02 55 / 0.06) 1px, transparent 1px),
    linear-gradient(90deg, oklch(40% 0.02 55 / 0.06) 1px, transparent 1px);
  background-size: 80px 80px;
  mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 80%);
  pointer-events: none;
}

/* ── Collage SVG ── */
.collage-svg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  color: var(--accent);
  pointer-events: none;
  z-index: 0;
  opacity: 0.8;
}

/* ── Main layout ── */
.main {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; min-height: 100svh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.menu-container {
  width: 100%; max-width: var(--menu-max);
  padding: clamp(16px, 3vw, 48px) clamp(12px, 2vw, 24px);
  display: flex; flex-direction: column; align-items: center;
}

/* ── Logo region ── */
.logo-region {
  text-align: center;
  margin-bottom: clamp(24px, 5vh, 48px);
  position: relative;
}

.title {
  font-family: var(--font-display);
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--accent);
  text-align: center;
  line-height: 1.15;
  text-shadow: 0 2px 12px oklch(65% 0.12 80 / 0.3);
  user-select: none;
}
  /* Ornamental fleur-de-lis flanking the title */
.title-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 2vw, 16px);
}
.title-flank {
  width: clamp(18px, 3vw, 28px);
  height: clamp(22px, 3.5vw, 34px);
  color: var(--accent-dim);
  opacity: 0.6;
  flex-shrink: 0;
  user-select: none;
}

.title-small {
  display: block;
  font-family: var(--font-display);
  font-size: clamp(13px, 2vw, 16px);
  font-weight: 400;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: clamp(6px, 1.5vh, 12px);
}

.title-emblem {
  display: block;
  width: clamp(32px, 6vw, 48px);
  height: clamp(32px, 6vw, 48px);
  margin: 0 auto clamp(12px, 2vh, 20px);
  position: relative;
  color: var(--accent);
}

/* Ornate 8-point compass rose */
.compass-rose {
  display: block;
  width: 100%; height: 100%;
  position: relative;
}
.compass-rose::before,
.compass-rose::after {
  content: '';
  position: absolute;
  background: var(--accent);
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
}
.compass-rose::before {
  width: 2px; height: 100%;
  opacity: 0.8;
}
.compass-rose::after {
  width: 100%; height: 2px;
  opacity: 0.8;
}
/* Diagonal arms */
.compass-rose .arm {
  position: absolute;
  left: 50%; top: 50%;
  width: 1.5px; height: 60%;
  background: var(--accent);
  opacity: 0.45;
  transform-origin: center center;
}
.compass-rose .arm.arm-ne { transform: translate(-50%, -50%) rotate(45deg); }
.compass-rose .arm.arm-nw { transform: translate(-50%, -50%) rotate(-45deg); }
/* Center medallion */
.compass-rose .medallion {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: clamp(8px, 2vw, 12px);
  height: clamp(8px, 2vw, 12px);
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px oklch(75% 0.12 85 / 0.5);
  z-index: 1;
}
.compass-rose .medallion::after {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--bg-deep);
}
/* Outer ring */
.compass-rose .ring {
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: clamp(24px, 5vw, 36px);
  height: clamp(24px, 5vw, 36px);
  border-radius: 50%;
  border: 1px solid var(--accent);
  opacity: 0.35;
}

.subtitle {
  font-family: var(--font-display);
  font-size: clamp(13px, 2vw, 15px);
  font-style: italic;
  color: var(--muted);
  margin-bottom: clamp(8px, 2vh, 16px);
  letter-spacing: 0.03em;
}

/* ── Ornate brass divider ── */
.brass-divider {
  width: clamp(120px, 18vw, 180px);
  height: 2px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    var(--accent-dim) 15%,
    var(--accent) 50%,
    var(--accent-dim) 85%,
    transparent 100%
  );
  margin: clamp(10px, 2vh, 18px) auto clamp(20px, 3vh, 32px);
  position: relative;
}
/* Diamond centerpiece */
.brass-divider::before {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  width: 7px; height: 7px;
  background: var(--accent);
  border: 1px solid var(--accent-bright);
  box-shadow: 0 0 6px oklch(75% 0.12 85 / 0.5);
}
/* Ornamental dots at ends */
.brass-divider::after {
  content: '';
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: clamp(60px, 10vw, 100px);
  height: 0;
  border-top: 1px dotted var(--accent-dim);
  opacity: 0.4;
}

/* ── Buttons region ── */
.buttons-region {
  width: 100%;
  display: flex; flex-direction: column;
  gap: clamp(8px, 1.5vh, 12px);
  position: relative;
}
/* Ornamental scroll brackets flanking the button panel */
.buttons-region::before,
.buttons-region::after {
  content: '';
  position: absolute;
  top: 10%; bottom: 10%;
  width: 4px;
  background:
    linear-gradient(180deg,
      transparent 0%,
      var(--accent-dim) 8%,
      var(--accent) 50%,
      var(--accent-dim) 92%,
      transparent 100%
    );
  opacity: 0.45;
  border-radius: 2px;
}
.buttons-region::before { left: -10px; }
.buttons-region::after  { right: -10px; }
/* Tiny ornamental dots along the brackets */
.buttons-region::before {
  box-shadow:
    -2px 6px 0 -1px var(--accent-dim),
    -2px -6px 0 -1px var(--accent-dim);
}
.buttons-region::after {
  box-shadow:
    2px 6px 0 -1px var(--accent-dim),
    2px -6px 0 -1px var(--accent-dim);
}

/* Wood-panel button */
.menu-btn {
  width: 100%;
  padding: clamp(12px, 2.5vh, 16px) clamp(16px, 3vw, 24px);
  border: none;
  background:
    linear-gradient(
      180deg,
      var(--surface-lite) 0%,
      var(--surface) 40%,
      var(--bg-deep) 100%
    );
  color: var(--fg);
  font-family: var(--font-display);
  font-size: clamp(15px, 2.2vw, 18px);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-align: center;
  cursor: pointer;
  position: relative;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.25s, background 0.25s, text-shadow 0.25s;
  border-top: 1.5px solid var(--accent-dim);
  border-bottom: 1.5px solid var(--accent-dim);
  box-shadow:
    inset 0 1px 0 oklch(60% 0.08 80 / 0.12),
    inset 0 -1px 0 oklch(8% 0.01 40 / 0.4);
  /* Engraved/embossed text */
  text-shadow:
    0 1px 0 oklch(8% 0.01 40 / 0.5),
    0 -1px 0 oklch(60% 0.08 80 / 0.08);
  min-height: 48px;
}

.menu-btn::before,
.menu-btn::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--accent-dim);
  opacity: 0.6;
}
.menu-btn::before { left: 0; }
.menu-btn::after  { right: 0; }

/* Ornate corner brackets — colonial brass L-brackets */
.menu-btn .brass-corner {
  position: absolute;
  width: 10px; height: 10px;
  pointer-events: none;
  opacity: 0.75;
  transition: opacity 0.25s, border-color 0.25s;
}
.menu-btn .brass-corner.tl {
  top: 3px; left: 3px;
  border-top: 1.5px solid var(--accent);
  border-left: 1.5px solid var(--accent);
}
.menu-btn .brass-corner.tr {
  top: 3px; right: 3px;
  border-top: 1.5px solid var(--accent);
  border-right: 1.5px solid var(--accent);
}
.menu-btn .brass-corner.bl {
  bottom: 3px; left: 3px;
  border-bottom: 1.5px solid var(--accent);
  border-left: 1.5px solid var(--accent);
}
.menu-btn .brass-corner.br {
  bottom: 3px; right: 3px;
  border-bottom: 1.5px solid var(--accent);
  border-right: 1.5px solid var(--accent);
}

/* Decorative tick marks on the bracket arms */
.menu-btn .brass-corner.tl::after {
  content: '';
  position: absolute;
  top: 4px; left: -1.5px;
  width: 3px; height: 1px;
  background: var(--accent);
}
.menu-btn .brass-corner.tr::after {
  content: '';
  position: absolute;
  top: 4px; right: -1.5px;
  width: 3px; height: 1px;
  background: var(--accent);
}
.menu-btn .brass-corner.bl::after {
  content: '';
  position: absolute;
  bottom: 4px; left: -1.5px;
  width: 3px; height: 1px;
  background: var(--accent);
}
.menu-btn .brass-corner.br::after {
  content: '';
  position: absolute;
  bottom: 4px; right: -1.5px;
  width: 3px; height: 1px;
  background: var(--accent);
}

.menu-btn:hover .brass-corner {
  opacity: 1;
}
.menu-btn:hover .brass-corner.tl {
  border-color: var(--accent-bright);
}
.menu-btn:hover .brass-corner.tr {
  border-color: var(--accent-bright);
}
.menu-btn:hover .brass-corner.bl {
  border-color: var(--accent-bright);
}
.menu-btn:hover .brass-corner.br {
  border-color: var(--accent-bright);
}

.menu-btn.disabled .brass-corner { opacity: 0.25; }

.menu-btn:hover {
  background:
    linear-gradient(
      180deg,
      oklch(35% 0.018 55) 0%,
      var(--surface-lite) 40%,
      var(--surface) 100%
    );
  color: var(--accent-bright);
  text-shadow:
    0 1px 0 oklch(8% 0.01 40 / 0.5),
    0 -1px 0 oklch(60% 0.08 80 / 0.12),
    0 0 12px oklch(75% 0.12 85 / 0.3);
  border-top: 1.5px solid var(--accent);
  border-bottom: 1.5px solid var(--accent);
  box-shadow:
    inset 0 1px 0 oklch(60% 0.08 80 / 0.2),
    inset 0 -1px 0 oklch(8% 0.01 40 / 0.4),
    0 0 18px oklch(65% 0.10 80 / 0.15);
  transition: color 0.15s, background 0.15s, border-color 0.2s, box-shadow 0.2s, text-shadow 0.2s;
}

.menu-btn:active {
  background:
    linear-gradient(
      180deg,
      var(--bg-deep) 0%,
      var(--surface) 40%,
      var(--surface-lite) 100%
    );
}

.menu-btn:focus-visible {
  outline: 1.5px solid var(--accent);
  outline-offset: -4px;
}

.menu-btn.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: auto;
}
.menu-btn.disabled .brass-corner {
  opacity: 0.25;
}

/* ── Load Game disabled tooltip ── */
.tooltip-wrapper {
  position: relative;
  width: 100%;
}
.tooltip-text {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-deep);
  color: var(--muted);
  font-family: var(--font-body);
  font-size: 11px;
  font-style: italic;
  padding: 5px 12px;
  border: 1px solid var(--border);
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 2;
}
.tooltip-wrapper:focus-within .tooltip-text,
.tooltip-wrapper:hover .tooltip-text {
  opacity: 1;
}

/* ── Footer region ── */
.footer-region {
  margin-top: clamp(20px, 4vh, 36px);
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(10px, 2vh, 16px);
  width: 100%;
}

.version {
  font-family: var(--font-mono);
  font-size: clamp(10px, 1.5vw, 12px);
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  opacity: 0.7;
}

.quit-btn {
  padding: clamp(8px, 1.5vh, 12px) clamp(16px, 3vw, 24px);
  border: none;
  background:
    linear-gradient(
      180deg,
      var(--surface) 0%,
      var(--bg-deep) 100%
    );
  color: var(--muted);
  font-family: var(--font-display);
  font-size: clamp(12px, 1.8vw, 14px);
  font-weight: 600;
  letter-spacing: 0.1em;
  text-align: center;
  cursor: pointer;
  min-width: clamp(100px, 30%, 160px);
  min-height: 44px;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  position: relative;
  transition: color 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.quit-btn::before,
.quit-btn::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: var(--border);
}
.quit-btn::before { left: 0; }
.quit-btn::after  { right: 0; }
.quit-btn:hover {
  color: var(--accent-bright);
  background:
    linear-gradient(
      180deg,
      var(--surface-lite) 0%,
      var(--surface) 100%
    );
}
.quit-btn:focus-visible {
  outline: 1.5px solid var(--accent);
  outline-offset: -4px;
}

/* ── State toggle (demo control) ── */
.state-toggle {
  position: fixed;
  bottom: 16px;
  right: 16px;
  z-index: 10;
  display: flex; gap: 6px;
}
.state-toggle button {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--bg-deep);
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.state-toggle button:hover,
.state-toggle button.active {
  color: var(--accent);
  border-color: var(--accent-dim);
}

/* ── Responsive ── */
@media (max-width: 430px) {
  .menu-container {
    padding: 24px 12px;
  }
  .menu-btn {
    letter-spacing: 0.04em;
  }
}

@media (min-width: 768px) {
  .menu-container {
    padding: 48px 24px;
  }
  .title {
    letter-spacing: 0.08em;
  }
}

@media (min-width: 1440px) {
  :root { --menu-max: 420px; }
  .title { font-size: 48px; }
  .menu-btn { font-size: 18px; }
}

@media (min-width: 1920px) {
  :root { --menu-max: 440px; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>

<div class="state-toggle" id="state-toggle">
  <button data-state="default" class="active" onclick="setState('default')">Default</button>
  <button data-state="victory" onclick="setState('victory')">After Victory</button>
  <button data-state="nosaves" onclick="setState('nosaves')">No Saves</button>
  <button data-state="resume" onclick="setState('resume')">Auto-save exists</button>
  <button data-state="all" onclick="setState('all')">All</button>
</div>

<script>
function setState(s) {
  document.querySelectorAll('#state-toggle button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`#state-toggle button[data-state="${s}"]`);
  if (btn) btn.classList.add('active');

  const subtitle   = document.getElementById('subtitle');
  const btnResume  = document.getElementById('btn-resume');
  const btnLoad    = document.getElementById('btn-load');
  const tooltipEl  = document.querySelector('.tooltip-text');

  subtitle.style.display = 'none';
  btnResume.style.display = 'none';
  btnLoad.classList.remove('disabled');
  tooltipEl.textContent = 'No saved games found.';

  switch (s) {
    case 'victory':
      subtitle.style.display = 'block';
      break;
    case 'nosaves':
      btnLoad.classList.add('disabled');
      break;
    case 'resume':
      btnResume.style.display = 'block';
      break;
    case 'all':
      subtitle.style.display = 'block';
      btnResume.style.display = 'block';
      btnLoad.classList.add('disabled');
      break;
    default:
      break;
  }
}

function handleAction(id) {
  const el = document.getElementById(`btn-${id === 'new-game' ? 'new-game' : id}`);
  if (el && el.classList.contains('disabled')) return;

  const names = {
    'new-game': 'New Game',
    resume: 'Resume Game',
    load: 'Load Game',
    settings: 'Settings',
    quit: 'Quit'
  };
  if (el) {
    el.style.color = 'var(--accent-bright)';
    setTimeout(() => { el.style.color = ''; }, 200);
  }
  console.log(`[ColonizeThis] Action: ${names[id] || id}`);
}
</script>
