<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColonizeThis — Next Turn Confirm</title>
<style>
:root {
  --bg: oklch(16% 0.018 50); --bg-deep: oklch(12% 0.015 45);
  --surface: oklch(24% 0.015 45); --surface-lite: oklch(30% 0.016 52);
  --fg: oklch(88% 0.015 80); --muted: oklch(65% 0.025 70);
  --border: oklch(40% 0.02 55); --accent: oklch(72% 0.14 85); --accent-dim: oklch(60% 0.12 82);
  --font-display: 'Iowan Old Style','Cinzel','Charter',Georgia,serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;overflow:hidden}
.scrim{position:fixed;inset:0;background:oklch(0% 0 0 / 0.6);z-index:0}
.dialog{position:relative;z-index:1;width:min(88vw,340px);background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 30%,var(--bg-deep) 100%);border:2px solid var(--accent-dim);padding:20px;text-align:center;display:flex;flex-direction:column;gap:14px}
.dialog h3{font-family:var(--font-display);font-size:clamp(18px,2.5vw,22px);font-weight:700;letter-spacing:0.05em;color:var(--accent)}
.dialog p{font-family:var(--font-body);font-size:clamp(13px,1.7vw,15px);color:var(--muted);line-height:1.45}
.actions{display:flex;gap:10px;justify-content:center;margin-top:4px}
.btn{padding:10px 22px;font-family:var(--font-display);font-size:14px;font-weight:600;letter-spacing:0.06em;cursor:pointer;border:none;transition:color 0.15s,background 0.15s;min-width:80px}
.btn-no{background:linear-gradient(180deg,var(--surface) 0%,var(--bg-deep) 100%);border-top:1px solid var(--border);border-bottom:1px solid var(--border);color:var(--muted)}
.btn-no:hover{color:var(--fg)}
.btn-yes{background:linear-gradient(180deg,var(--surface-lite) 0%,var(--surface) 40%,var(--bg-deep) 100%);border-top:1.5px solid var(--accent-dim);border-bottom:1.5px solid var(--accent-dim);color:var(--fg)}
.btn-yes:hover{color:var(--accent)}
/* Processing state */
.dialog.processing{display:none}
.dialog h3 .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<!-- Confirm dialog -->
<div class="dialog" id="confirm">
  <h3>End turn?</h3>
  <p>Turn <strong id="turn-num">42</strong> will end. The AI will process all remaining actions and the next turn will begin. Continue?</p>
  <div class="actions">
    <button class="btn btn-no" onclick="location.reload()">No</button>
    <button class="btn btn-yes" onclick="startProcessing()">Yes, end turn</button>
  </div>
</div>
<!-- Processing dialog -->
<div class="dialog" id="processing" style="display:none">
  <h3><span class="spinner"></span>Processing Turn</h3>
  <p id="phase">Generating AI orders...</p>
</div>
<script>
const phases = ['Generating AI orders...','Processing diplomacy...','Resolving military actions...','Computing extraction...','Applying production...','Finalizing turn...']
let pi=0
function startProcessing(){
  document.getElementById('confirm').style.display='none'
  document.getElementById('processing').style.display='flex'
  pi=0
  document.getElementById('phase').textContent=phases[0]
  const iv=setInterval(()=>{
    pi++
    if(pi<phases.length) document.getElementById('phase').textContent=phases[pi]
    else{clearInterval(iv);setTimeout(()=>{location.reload()},1200)}
  },800)
}
</script>
</body>
</html>
