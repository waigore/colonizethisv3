# Pytool: Python image and tileset pipeline tools. See SPEC/ui/pytool-image-tools.md, SPEC/ui/wang-tileset-and-assets.md.
# Use uv: uv sync (from repo root or pytool/), then uv run pytool/tileset_terrain.py ...
[project]
name = "pytool"
version = "0.1.0"
description = "Python image and tileset pipeline tools for ColonizeThis UI assets"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "requests>=2.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
project-stats = "project_stats:main"
