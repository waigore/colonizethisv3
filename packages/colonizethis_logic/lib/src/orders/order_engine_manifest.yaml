# Declarative manifest for generated OrderEngine slot wiring (order_engine.g.dart).
# validatePlayerOrdersWithContext stays hand-written in order_engine.dart.
#
# SPEC/program/order-engine.md — Code generation (OrderEngine slots)

engine_slots:
  - order_type: MoveOrder
    orders_field: moveOrdersByPlayerId
    copy_with_param: moveOrdersByPlayerId
    log_label: move
    add_method: addMoveOrder
    add_with_context_method: addMoveOrderWithContext
    remove_method: removeMoveOrder

  - order_type: ArmyMoveOrder
    orders_field: armyMoveOrdersByPlayerId
    copy_with_param: armyMoveOrdersByPlayerId
    log_label: army move
    add_method: addArmyMoveOrder
    add_with_context_method: addArmyMoveOrderWithContext
    remove_method: removeArmyMoveOrder

  - order_type: BuildUnitOrder
    orders_field: buildUnitOrdersByPlayerId
    copy_with_param: buildUnitOrdersByPlayerId
    log_label: build
    add_method: addBuildOrder
    add_with_context_method: addBuildOrderWithContext
    remove_method: removeBuildOrder

  - order_type: WorkOrder
    orders_field: workOrdersByPlayerId
    copy_with_param: workOrdersByPlayerId
    log_label: work
    add_method: addWorkOrder
    add_with_context_method: addWorkOrderWithContext
    remove_method: removeWorkOrder

  - order_type: DiplomaticOrder
    orders_field: diplomaticOrdersByPlayerId
    copy_with_param: diplomaticOrdersByPlayerId
    log_label: diplomatic
    add_method: addDiplomaticOrder
    add_with_context_method: addDiplomaticOrderWithContext
    remove_method: removeDiplomaticOrder

  - order_type: NavalMoveOrder
    orders_field: navalMoveOrdersByPlayerId
    copy_with_param: navalMoveOrdersByPlayerId
    log_label: naval move
    add_method: addNavalMoveOrder
    add_with_context_method: addNavalMoveOrderWithContext
    remove_method: removeNavalMoveOrder

  - order_type: NavalMissionOrder
    orders_field: navalMissionOrdersByPlayerId
    copy_with_param: navalMissionOrdersByPlayerId
    log_label: naval mission
    add_method: addNavalMissionOrder
    add_with_context_method: addNavalMissionOrderWithContext
    remove_method: removeNavalMissionOrder

  - order_type: RecruitWorkerOrder
    orders_field: recruitWorkerOrdersByPlayerId
    copy_with_param: recruitWorkerOrdersByPlayerId
    log_label: recruit worker
    add_method: addRecruitWorkerOrder
    add_with_context_method: addRecruitWorkerOrderWithContext
    remove_method: removeRecruitWorkerOrder

# Copied in constructor and _copyOrders only; no engine slot or add*Order API.
storage_only:
  - orders_field: researchOrdersByPlayerId
    copy_with_param: researchOrdersByPlayerId
