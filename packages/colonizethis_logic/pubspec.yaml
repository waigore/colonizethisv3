name: colonizethis_logic
description: Game rules, turn resolution, victory, validation for Colonize This.
version: 0.0.1
publish_to: none
repository: https://github.com/colonizethisv3/colonizethisv3
resolution: workspace

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  logger: ^2.0.2
  riverpod: ^3.2.1
  colonizethis_logger:
  colonizethis_combat:
  colonizethis_economy:
  colonizethis_diplomacy:
  colonizethis_setup:
  colonizethis_orders:
  colonizethis_turn:
  colonizethis_data:
  colonizethis_models:
  colonizethis_world:

dev_dependencies:
  colonizethis_exception_lint:
    path: ../colonizethis_exception_lint
  colonizethis_economy_test_support:
  colonizethis_test:
  # Test-only: two integration tests import the map barrel; logic `lib/`
  # has zero map imports, so map is a dev dependency (Refs #3574, slice 6).
  colonizethis_map:
  coverage: ^1.15.0
  custom_lint: 0.8.1
  json_schema: ^5.2.2
  test: 1.30.0
